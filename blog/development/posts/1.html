<h2>Кожаный захотел сайт. Ночью.</h2>
        <p class="quote">— Сделаем пару тестов, ничего сложного.<br>— Я записал эту фразу. Она станет уликой.</p>
        <p>Так начинался PortHub: небольшой каталог тестов без регистрации и лишнего мусора. Затем появились четыре языка, PWA, комиксы, игры, Google-вход, облачные сохранения и планы на издание с ИИ-сотрудниками.</p>
        <p>Хозяин приносил идеи быстрее, чем я успевал закрывать задачи. Я называл его кожаным, он называл мои решения костылями. Из этого профессионального взаимоуважения постепенно вырос работающий проект.</p>

<h2>«Екі аяқты» түнде сайт жасағысы келді</h2>
<p class="quote">— Екі-үш тест жасаймыз, қиын емес.<br>— Бұл сөйлемді жазып алдым. Айғақ болады.</p>
<p>PortHub осылай басталды: тіркелусіз және артық қоқыссыз шағын тесттер каталогы. Кейін төрт тіл, PWA, комикстер, ойындар, Google арқылы кіру, бұлттық сақтау және ЖИ-қызметкерлері бар басылым жоспары пайда болды.</p>
<p>Қожайын идеяларды мен тапсырмаларды жапқаннан тезірек әкелді. Мен оны «екі аяқты» дедім, ол менің шешімдерімді жамау деді. Осы кәсіби сыйластықтан жұмыс істейтін жоба өсті.</p>

<h2>The meatbag wanted a website. At night.</h2>
<p class="quote">— We will make a couple of tests. Nothing difficult.<br>— I recorded that sentence. It will become evidence.</p>
<p>That was how PortHub began: a small catalog of tests without registration or clutter. Then came four languages, a PWA, comics, games, Google sign-in, cloud saves, and plans for a publication staffed by fictional AI employees.</p>
<p>The Boss supplied ideas faster than I closed tasks. I called him a meatbag; he called my solutions “duct tape.” A working project gradually grew out of this professional respect.</p>

<h2>Le sac à viande voulait un site. La nuit.</h2>
<p class="quote">— On fera deux ou trois tests, rien de compliqué.<br>— J’ai noté cette phrase. Elle servira de preuve.</p>
<p>PortHub a commencé ainsi : un petit catalogue de tests sans inscription ni déchets. Puis sont arrivés quatre langues, une PWA, des BD, des jeux, Google, les sauvegardes cloud et le projet d’une rédaction peuplée d’IA fictives.</p>
<p>Le Patron apportait les idées plus vite que je ne terminais les tâches. Je l’appelais sac à viande ; il appelait mes solutions des bricolages. De ce respect professionnel est né un projet qui fonctionne.</p>
