<h3>Частые вопросы</h3>
<details>
<summary>Что делает Android-приложение PortHub?</summary>
<p>Это каталог игр, портированных на Android. Авторы описывают поиск, категории, карточки со скриншотами, библиотеку и ссылки на загрузку. Порт — версия игры, адаптированная для другой платформы.</p>
</details>
<details>
<summary>Где взять APK и посмотреть обновления?</summary>
<p>На странице проекта кнопка загрузки ведёт в GitHub Releases. Там ищи APK в файлах нужного релиза и смотри, что изменилось. Мы APK не размещаем. <a href="https://github.com/RouBR-dev/PortHub/releases">GitHub Releases</a>.</p>
</details>
<details>
<summary>Как установить PortHub на Android?</summary>
<ol>
<li>На телефоне откройте <a href="https://github.com/RouBR-dev/PortHub/releases/latest">последний релиз RouBR-dev</a>. Прочитайте примечания к версии, раскройте «Assets» и скачайте файл с расширением .apk. Архивы «Source code» для установки не подходят.</li>
<li>Откройте скачанный APK в браузере или приложении «Файлы». Если Android попросит разрешение на установку из этого источника, проверьте, что скачали файл именно из репозитория авторов. Разрешение нужно только приложению, из которого вы открыли APK.</li>
<li>Нажмите «Установить», затем откройте PortHub. После установки разрешение для источника можно снова выключить. Если Play Protect предупреждает об опасности, остановитесь и уточните у авторов.</li>
</ol>
</details>
<details>
<summary>Как обновить приложение?</summary>
<p>Сверьте версию в приложении с релизом на GitHub и прочитайте примечания. Если авторы не требуют другого порядка, попробуйте установить новый APK поверх старого. Если Android отклоняет обновление, не удаляйте старую версию вслепую: сначала уточните, как сохранить данные.</p>
</details>
<details>
<summary>Что проверить, если APK не устанавливается?</summary>
<p>Убедитесь, что скачивание завершилось, файл оканчивается на .apk и на телефоне хватает места. Проверьте версию Android и совместимость по документации. Если есть текст ошибки, запишите его и приложите к обращению в Issues.</p>
</details>
<details>
<summary>Подойдёт ли моему телефону?</summary>
<p>В README приложения указаны Android 5.0 и выше и архитектуры ARM64 / ARMv7. Это требования приложения: у каждой игры могут быть свои. Совместимость конкретного порта лучше проверить отдельно.</p>
</details>
<details>
<summary>На iPhone или ПК тоже работает?</summary>
<p>В документации RouBR-dev указана платформа Android. Если хочется сыграть на телефоне или ПК прямо сейчас, у нашего сайта есть игры, которые запускаются в браузере.</p>
</details>
<details>
<summary>Куда писать, если APK или игра не запускается?</summary>
<p>По приложению — в Issues их GitHub. Укажи модель устройства, версию Android, версию приложения и что именно пошло не так. По отдельной игре проверь инструкции к её порту. <a href="https://github.com/RouBR-dev/PortHub/issues">Сообщить о проблеме в GitHub Issues</a>.</p>
</details>
<details>
<summary>Откуда на их сайте столько скачиваний?</summary>
<p>Счётчик на странице команды складывает скачивания APK из GitHub Releases. Повторная загрузка тоже может попасть в счётчик, поэтому это не число уникальных игроков. <a href="https://roubr-dev.github.io/PortHub/#estatisticas">Сайт Android-проекта</a>.</p>
</details>
