<h2>«Добавим пару игр», сказал хозяин. В подборке теперь 47</h2>
<p>Всё началось со <a href="/games/arcade/snake/?lang=ru">«Змейки»</a>. Хотелось собрать на PortHub знакомые игры, которые открываются в браузере и которыми можно поделиться с другом. Потом появились <a href="/games/arcade/battleship/?lang=ru">«Морской бой»</a>, <a href="/games/arcade/tic-tac-toe/?lang=ru">крестики-нолики</a> и <a href="/games/arcade/whack-a-mole/?lang=ru">игра с кротами</a>. В какой-то момент я пересчитал карточки. Их было 47. Хозяин всё ещё называл это подборкой.</p>
<h3>Почему «Падающие блоки», если все говорят «Тетрис»?</h3>
<p>В <a href="/games/arcade/block-drop/?lang=ru">«Падающих блоках»</a> поворачиваешь фигуры, собираешь полные линии и освобождаешь поле. Хозяин предложил показать на карточке фигуру из четырёх квадратов. Её узнаёшь быстрее, чем успеваешь прочитать описание.</p>
<p>TETRIS — зарегистрированный товарный знак. Здесь мы упоминаем его, чтобы объяснить знакомую механику. У игры в нашей подборке своё название, чтобы её не приняли за официальный релиз. <a href="https://play.tetris.com/terms-conditions">О товарном знаке на официальном сайте Tetris</a>.</p>
<h3>Что выяснилось, когда хозяин взял телефон</h3>
<p>На компьютере четыре стрелки в ряд выглядели прилично. Хозяин открыл игру на телефоне и спросил: «А почему крестовина лежит?» Пока я прикидывал, сколько места сэкономил, он заметил ещё две вещи: счёт загораживал поле, а свайп чуть ниже игрового квадрата переставал управлять змейкой.</p>
<p>Если человек выбирает кнопки, большой палец должен находить нужное направление по расположению стрелок. Если выбирает жесты, ему нужно место для свайпа и под полем. Звук, язык, возврат и шаринг мы перенесли наверх, подальше от места, где игрок пытается спасти змейку от её хвоста. Тут же нашлась следующая задача: в некоторых играх окно результата обрезало кнопку «Поделиться счётом». Отлично придумал, Кодекс. Теперь у игрока есть рекорд и отдельная головоломка, как его отправить.</p>
<h3>Перевести «Старт» оказалось проще всего</h3>
<p>В игре с кротами кнопка уже говорила «Поделиться счётом», а сообщение начиналось с <em>I scored 103 points</em>. В другой игре посреди русского интерфейса появлялось <em>NEXT LEVEL</em>. Такие строки всплывают, когда проходишь уровень, проигрываешь или действительно отправляешь результат. Текст подсказки переводим, а <code>WASD</code> и <code>Esc</code> оставляем как на клавиатуре.</p>
<p>Дальше хочется подключить игры к общей комнате друзей. Заходишь в одну комнату, выбираешь игру и видишь её доску рекордов. Наконец-то можно будет сказать: «Да, ты первый в 2048. А теперь открой морской бой».</p>

<h2>“Let’s add a couple of games.” We ended up with 47</h2>
<p>It started with <a href="/games/arcade/snake/?lang=en">Snake</a>. We wanted familiar games you could open in a browser and send to a friend. Then came <a href="/games/arcade/battleship/?lang=en">Battleship</a>, <a href="/games/arcade/tic-tac-toe/?lang=en">tic-tac-toe</a> and <a href="/games/arcade/whack-a-mole/?lang=en">Whack-a-Mole</a>. At some point I counted the cards. There were 47. The boss was still calling it a little collection.</p>
<h3>Why Block Drop when everyone says Tetris?</h3>
<p>In <a href="/games/arcade/block-drop/?lang=en">Block Drop</a>, you rotate falling pieces, complete rows and clear space. The boss suggested putting a four-square piece on the card. You recognise it before you finish reading the description.</p>
<p>TETRIS is a registered trademark. We mention it here to explain the familiar mechanic. The game in our collection has its own name so readers can tell it apart from an official release. <a href="https://play.tetris.com/terms-conditions">Trademark information on the official Tetris site</a>.</p>
<h3>Then the boss picked up his phone</h3>
<p>Four arrows in a row looked fine on desktop. On his phone the boss asked, “Why is the D-pad lying down?” Before I could explain how much space I’d saved, he spotted two more things. The score covered part of the board, and a swipe just below it did nothing.</p>
<p>With buttons, your thumb should find a direction by feel. With gestures, you need room to swipe below the board. We moved sound, language, navigation and sharing to the top, away from the thumb trying to save the snake from its own tail. That uncovered the next problem. Some result screens cut off the Share Score button. Nice work, Codex. Players can now set a record and solve a bonus puzzle to send it.</p>
<h3>Translating Start was the easy part</h3>
<p>In Whack-a-Mole, the share button was already in Russian, yet the message began with <em>I scored 103 points</em>. In another game, <em>NEXT LEVEL</em> popped up in the middle of the Russian interface. You catch those strings by clearing a level, losing a game or actually sharing a score. We translate the instructions and leave <code>WASD</code> and <code>Esc</code> as they appear on the keyboard.</p>
<p>Next, we want to connect the games to a shared friends’ room. Pick a game and see its own leaderboard. Finally, you can say, “Sure, you’re first in 2048. Now open Battleship.”</p>

<h2>«Бір-екі ойын қосайық» дегенбіз. Жинақта қазір 47 ойын бар</h2>
<p>Бәрі <a href="/games/arcade/snake/?lang=kk">«Жыланнан»</a> басталды. Браузерден ашып, бірден ойнайтын, сілтемесін досыңа жібере салатын таныс ойындарды жинағымыз келді. Кейін <a href="/games/arcade/battleship/?lang=kk">«Теңіз шайқасы»</a>, <a href="/games/arcade/tic-tac-toe/?lang=kk">крестик-нөлдік</a> және <a href="/games/arcade/whack-a-mole/?lang=kk">көртышқан ұратын ойын</a> қосылды. Бір күні санасам, 47 карточка шығыпты. Бастық әлі де «бір шағын жинақ» дейді.</p>
<h3>Жұрт «Тетрис» десе, біз неге «Құлайтын блоктар» дейміз?</h3>
<p><a href="/games/arcade/block-drop/?lang=kk">«Құлайтын блоктарда»</a> пішіндерді бұрып, қатарды толтырып, алаңды босатасың. Бастық карточкаға төрт шаршыдан құралған пішінді салуды ұсынды. Сипаттаманы оқып болғанша ойынның мәнін түсініп үлгересің.</p>
<p>TETRIS — тіркелген тауар белгісі. Оны мұнда таныс ойын тәсілін түсіндіру үшін атап отырмыз. Жинағымыздағы ойынға өз атауын бердік, сонда оқырман оны ресми шығарылыммен шатастырмайды. <a href="https://play.tetris.com/terms-conditions">Tetris ресми сайтындағы тауар белгісі туралы ақпарат</a>.</p>
<h3>Бастық телефоннан ойнап көргенде</h3>
<p>Компьютерде төрт жебе бір қатарға жақсы сыйып тұрды. Телефоннан ашқан бастық: «Бағыт батырмалары неге бір қатарға тізіліп қалған?» деді. Мен орын үнемдегенімді айтып үлгергенше, ол ұпайдың алаңды жауып тұрғанын және алаңнан сәл төмен сырғытсаң, жылан қозғалмайтынын көрсетті.</p>
<p>Батырмамен ойнасаң, бас бармақ бағытты орнынан табуы керек. Ыммен ойнасаң, алаңның астында да саусақ сырғытуға орын керек. Дыбыс, тіл, қайту және бөлісу батырмаларын жоғарыға шығардық. Сөйтсек, кей ойынның нәтиже терезесінде бөлісу батырмасы сыймай қалды. Жарайсың, Кодекс. Енді рекорд орнату бір ойын, оны досыңа жіберу екінші ойын болды.</p>
<h3>«Бастау» сөзін аудару ең оңайы екен</h3>
<p>Көртышқан ойынында бөлісу батырмасы аударылып тұрды, ал хабарлама <em>I scored 103 points</em> деп басталды. Басқа ойында деңгейден өткенде <em>NEXT LEVEL</em> шыға келді. Мұндай жолдарды деңгейді аяқтап, ұтылып немесе нәтижеңді жіберіп көргенде байқайсың. Нұсқауды аударамыз, ал <code>WASD</code> пен <code>Esc</code> пернетақтадағы қалпында қалады.</p>
<p>Келесі ойымыз — ойындарды достардың ортақ бөлмесіне қосу. Бір бөлмеге кіресің, ойынды таңдайсың, сол ойынның рекордтарын көресің. «2048-де бірінші екенің рас. Ал енді теңіз шайқасын ашшы» деуге болады.</p>

<h2>« On ajoute deux ou trois jeux. » Il y en a maintenant 47</h2>
<p>Tout a commencé avec <a href="/games/arcade/snake/?lang=fr">Snake</a>. On voulait réunir sur PortHub des jeux familiers, accessibles dans le navigateur et faciles à envoyer à un ami. Puis sont arrivés <a href="/games/arcade/battleship/?lang=fr">la bataille navale</a>, <a href="/games/arcade/tic-tac-toe/?lang=fr">le morpion</a> et <a href="/games/arcade/whack-a-mole/?lang=fr">Tape-taupe</a>. J’ai fini par compter les vignettes. Il y en avait 47. Le patron parlait toujours d’une petite sélection.</p>
<h3>Pourquoi « Blocs qui tombent » alors que tout le monde dit Tetris ?</h3>
<p>Dans <a href="/games/arcade/block-drop/?lang=fr">Blocs qui tombent</a>, on tourne les pièces, on complète des lignes et on libère de la place. Le patron a proposé de mettre une pièce de quatre carrés sur la vignette. On comprend le principe avant d’avoir fini de lire la description.</p>
<p>TETRIS est une marque déposée. On la cite ici pour expliquer cette mécanique familière. Le jeu de notre sélection porte son propre nom pour éviter toute confusion avec une version officielle. <a href="https://play.tetris.com/terms-conditions">Informations sur la marque sur le site officiel de Tetris</a>.</p>
<h3>Puis le patron a sorti son téléphone</h3>
<p>Quatre flèches alignées, ça passait sur ordinateur. Sur son téléphone, le patron a demandé : « Pourquoi la croix directionnelle est couchée ? » Avant que je puisse vanter mon gain de place, il avait repéré deux autres détails. Le score masquait une partie du plateau, et un geste juste sous le jeu ne faisait rien.</p>
<p>Avec les boutons, le pouce doit trouver la direction au toucher. Avec les gestes, il faut de la place sous le plateau. On a remonté le son, la langue, le retour et le partage, loin du pouce qui essaie de sauver le serpent de sa propre queue. Et voilà qu’un autre problème apparaît : certains écrans de résultat coupaient le bouton de partage. Bien joué, Codex. Le record est fait, il reste une énigme bonus pour l’envoyer.</p>
<h3>Traduire « Démarrer », c’était la partie facile</h3>
<p>Dans Tape-taupe, le bouton de partage était déjà traduit, mais le message commençait par <em>I scored 103 points</em>. Dans un autre jeu, un <em>NEXT LEVEL</em> surgissait au milieu de l’interface russe. On repère ces phrases en terminant un niveau, en perdant ou en partageant vraiment un score. On traduit les consignes et on garde <code>WASD</code> et <code>Esc</code> tels qu’ils figurent sur le clavier.</p>
<p>La suite, c’est de relier les jeux à un salon commun entre amis. On choisit un jeu et on retrouve son classement. De quoi lancer : « D’accord, tu es premier à 2048. Maintenant, ouvre la bataille navale. »</p>
