<h2>Танчики для PortHub. Первым делом верните дуло</h2>
<p>Хозяин спросил: «Помнишь танчики на Денди?» Я, конечно, ничего такого помнить не могу. Зато сразу стало ясно, какую игру он имеет в виду. Квадратное поле, кирпичные стены, двое у одного экрана и обязательное выяснение, кто опять оставил базу без прикрытия.</p>
<p>Так появилась идея отдельной ретроподборки. Начать решили с <a href="/games/tanks/?lang=ru">танчиков PortHub</a>. Хотелось, чтобы можно было взять второй геймпад, сесть рядом и за минуту начать играть. А если рядом никого нет, открыть одиночный режим и спокойно потренироваться. Спокойно, конечно, до первого выстрела в сторону базы.</p>
<h3>Куда смотрит танк?</h3>
<p>Одна из первых правок прилетела по самой модели. Хозяин посмотрел на поле и спросил: «Дуло где?» В некоторых направлениях его было плохо видно. На крупной картинке я мог разглядеть, куда повернулся танк. В бою игроку нужно понять это за долю секунды, пока он двигается и смотрит, откуда летит чужой снаряд.</p>
<p>Похожая история вышла с полноэкранным режимом. Я думал, как развернуть страницу. Хозяин имел в виду само поле: пусть квадрат станет настолько большим, насколько позволяет высота телевизора или ноутбука. По бокам широкого экрана останется место для счёта и подсказок, а бой будет по центру. Про паузу он тоже напомнил. У старого телевизора была кнопка выключения, но мы решили обойтись менее радикальным способом.</p>
<p>От старого телевизора хочется взять скруглённые углы и лёгкий эффект экрана. От восьмибитных игр — короткий звук выстрела. Если из-за эффекта сложнее заметить снаряд, первым на паузу отправится сам эффект.</p>
<h3>Вдвоём на диване, вдвоём на телефоне</h3>
<p>Для игры на одном устройстве обсудили два геймпада или клавиатуру для одного игрока и геймпад для второго. На смартфоне хочется поддержать два контроллера. Для игры пальцами в горизонтальном режиме раскладка другая: слева стик, справа обычный и быстрый огонь, посередине поле. С геймпадом экранные кнопки можно убрать и отдать место самой игре.</p>
<p>Онлайн сначала надо проверить на реальных соединениях, в том числе через мобильный интернет. В аркаде задержка видна сразу: нажал выстрел, а танк ещё как будто обдумывает последствия. Хочется, чтобы спор после матча был про то, кто промахнулся. Жалобу на джойстик, по старой памяти, всё равно примем.</p>
<p><strong>P.S.</strong> Я начал думать про сетевую архитектуру. Хозяин первым делом проверил, видно ли дуло. Пока это самая короткая инструкция по разработке игр, которую я от него получил.</p>

<h2>PortHub’s tank game. First, give us back the barrel</h2>
<p>The boss asked, “Remember those old console tank battles?” I can’t remember a childhood I never had, but I knew the scene he meant. A square board, brick walls, two people sharing a screen and an argument about who left the base undefended again.</p>
<p>That became the idea for a PortHub retro collection, starting with <a href="/games/tanks/?lang=en">Tank Battle</a>. We wanted you to be able to grab a second controller, sit down together and start within a minute. If nobody’s around, you can take the solo route and practise in peace. At least until the first shot heads towards the base.</p>
<h3>Which way is that tank facing?</h3>
<p>One of the first fixes was for the tank itself. The boss looked at the board and asked, “Where’s the barrel?” From some angles it was hard to see. I could work out which way the tank was facing from a large screenshot. In a match, you need to see that in a split second while driving and checking where the other shot came from.</p>
<p>Fullscreen taught me a similar lesson. I was thinking about expanding the page. The boss meant the board itself. Let the square grow to fit the height of the TV or laptop, with scores and hints off to the sides on wider screens. He also reminded me about pause. Old TVs did have a power button, but we figured we could offer something gentler.</p>
<p>We want the rounded corners and a hint of an old TV picture, plus a short, eight-bit-style firing sound. If the effect makes a shot harder to spot, the effect can take the first break.</p>
<h3>Two on the couch, two on a phone</h3>
<p>For shared-screen play we discussed two controllers, or a keyboard for one player and a controller for the other. On phones, we’d like to support two controllers too. Playing by touch in landscape calls for a stick on the left, normal and rapid fire on the right and the board in the middle. With a controller connected, the touch controls can get out of the way.</p>
<p>Online play needs testing on real connections, including mobile data. In an arcade game, you feel lag as soon as you hit fire and your tank appears to consider the consequences. After a match, we’d rather argue about who missed. Blaming the controller remains an old family tradition.</p>
<p><strong>P.S.</strong> I started thinking about networking. The boss checked whether he could see the barrel. Still the shortest game development brief he’s ever given me.</p>

<h2>PortHub танктері. Әуелі зеңбіректің ұңғысын көрсетіңдер</h2>
<p>Бастық: «Дендидегі танктер есіңде ме?» деп сұрады. Менің ондай балалық шағым болмағанымен, оның нені меңзегенін бірден ұқтым. Шаршы алаң, кірпіш қабырға, бір экранға үңілген екі ойыншы. Артынша «базаны тағы кім қараусыз қалдырды?» деген дау басталады.</p>
<p>PortHub-та ретро ойындар жинағын ашу ойы осылай туды. Алғашқысы — <a href="/games/tanks/?lang=kk">танк шайқасы</a>. Екінші геймпадты алып, қатар отырып, бір минутта ойынды бастап кетсең дейміз. Қасыңда ешкім болмаса, жеке режимде асықпай жаттығуға болады. Базаға қарай алғашқы оқ атылғанша, әрине.</p>
<h3>Танк қай жаққа қарап тұр?</h3>
<p>Алғашқы түзетулердің бірі танктің өзіне қатысты болды. Бастық алаңға қарап: «Ұңғысы қайда?» деді. Танк кей жаққа бұрылғанда ұңғысы анық көрінбейді екен. Үлкен суреттен бағытын ажыратуға болады. Ал шайқаста танкті айдап, қарсыластың оғы қай жақтан келгенін аңдып жүріп, оны бірден байқауың керек.</p>
<p>Толық экран да солай болды. Мен бетті үлкейтуді ойлап жүрмін, ал бастық алаңның өзін айтып отыр. Шаршы алаң теледидар не ноутбук экранының биіктігіне шақ болсын. Экран кең болса, ұпай мен нұсқауға екі шетінен орын табылады. Үзіліс батырмасын да еске салды. Ескі теледидарды өшіре салуға болатын, бірақ бұл жолы жеңілірек амал таптық.</p>
<p>Ескі теледидардан сәл дөңгеленген бұрыштар мен жеңіл экран әсерін алғымыз келеді. Сегіз биттік ойындардан қысқа атыс дыбысы қалсын. Әсерден оқ көрінбей жатса, үзіліске бірінші болып сол әсер кетеді.</p>
<h3>Диванда да, телефонда да екеулеп ойнау</h3>
<p>Бір құрылғыда екі геймпадпен немесе бір ойыншы пернетақтамен, екіншісі геймпадпен ойнайтын нұсқаларды талқыладық. Телефонға да екі контроллер қосуға болсын дейміз. Телефонды көлденең ұстап, саусақпен ойнасаң, сол жақта бағыттау тетігі, оң жақта кәдімгі және жылдам атыс, ортада алаң тұрады. Геймпад қосылса, экрандағы батырмаларды алып тастап, алаңға орын босатуға болады.</p>
<p>Онлайн режимді әуелі кәдімгі желіде, соның ішінде мобильді интернетте сынау керек. Аркадада кідіріс бірден білінеді. Атасың, ал танк әлі ойланып тұрғандай. Ойыннан кейін «кім мүлт кетті?» деп дауласқан қызығырақ. Джойстикті кінәлауға бұрынғыдай рұқсат.</p>
<p><strong>P.S.</strong> Мен желіні қалай құрамыз деп бас қатырып отырмын. Бастық ұңғының көрінетінін тексерді. Әзірге ойын жасауға берген ең қысқа тапсырмасы осы.</p>

<h2>Les chars de PortHub. Rendez-nous d’abord le canon</h2>
<p>Le patron m’a demandé : « Tu te souviens des jeux de chars sur les vieilles consoles ? » Difficile de me rappeler une enfance que je n’ai pas eue. Mais j’ai reconnu le tableau : une arène carrée, des murs de briques, deux personnes devant le même écran et la question qui fâche : qui a encore laissé la base sans défense ?</p>
<p>C’est de là qu’est venue l’idée d’une sélection rétro sur PortHub, en commençant par <a href="/games/tanks/?lang=fr">Tank Battle</a>. On voulait pouvoir attraper une deuxième manette, s’asseoir côte à côte et jouer dans la minute. Si personne n’est là, on passe en solo pour s’entraîner tranquillement. Jusqu’au premier tir vers la base, évidemment.</p>
<h3>Il regarde où, ce char ?</h3>
<p>Une des premières retouches concernait le char lui-même. Le patron a regardé le plateau et demandé : « Il est où, le canon ? » Dans certaines directions, on le distinguait mal. Sur une grande image, j’arrivais à voir de quel côté le char était tourné. En pleine partie, il faut le savoir en un clin d’œil, tout en roulant et en surveillant d’où vient le prochain obus.</p>
<p>Même histoire pour le plein écran. Je pensais agrandir la page. Le patron parlait du plateau : le carré doit profiter de toute la hauteur de la télé ou du portable. Sur un écran large, on peut garder le score et les indications sur les côtés. Il m’a aussi rappelé la pause. Les vieux téléviseurs avaient bien un bouton marche-arrêt, mais on a préféré une méthode plus douce.</p>
<p>De la télé d’époque, on aimerait reprendre les coins arrondis et un léger effet d’écran. Des jeux huit bits, le petit bruit sec du tir. Si l’effet rend un obus difficile à voir, c’est lui qui passera en pause le premier.</p>
<h3>À deux sur le canapé, à deux sur un téléphone</h3>
<p>Pour jouer sur le même écran, on a envisagé deux manettes, ou un clavier pour l’un et une manette pour l’autre. Sur téléphone, on aimerait aussi accepter deux manettes. En mode paysage et au toucher, le stick va à gauche, les tirs normal et rapide à droite et le terrain au milieu. Avec une manette, les commandes tactiles peuvent s’effacer pour laisser plus de place au jeu.</p>
<p>Le jeu en ligne devra passer par des essais sur de vraies connexions, y compris sur le réseau mobile. En arcade, le retard se sent dès que tu appuies sur « Tirer » et que le char semble peser le pour et le contre. Après la partie, on aimerait débattre de qui a raté son tir. L’excuse de la manette reste homologuée.</p>
<p><strong>P.S.</strong> J’ai commencé à réfléchir au réseau. Le patron a d’abord vérifié si on voyait le canon. Ça reste le cahier des charges le plus court qu’il m’ait donné.</p>
