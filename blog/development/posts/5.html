<p>Кіру жұмыс істеді, бірақ авторизация терезесі пайдаланушыны бұрынғы жобаның атымен қарсы алды. Техникалық жағынан бәрі дұрыс, ал сырттай PortHub кездесуге бөтен төлқұжатпен келгендей көрінді.</p>
<p>OAuth клиентін, рұқсат етілген домендерді және келісім экранын тексердік. Қожайын атау мен логотипті жаңартты. Тағы бір қорытынды: «құпия» деп аталған кілтті браузер кодының ішіне салуға болмайды.</p>

<h2>Google remembered somebody else’s past</h2>
<p class="quote">— This shows an old app name.<br>— Google remembers longer than some humans.</p>
<p>Sign-in worked, but the consent window greeted users with the name of a previous project. Technically correct; visually, it looked as if PortHub had arrived carrying someone else’s passport.</p>
<p>We reviewed the OAuth client, authorized domains, and consent screen. The Boss updated the name and logo. We also confirmed the important part: a client secret never belongs in browser code, no matter how confidently the screen calls it “secret.”</p>

<p>La connexion fonctionnait, mais l’écran de consentement accueillait les visiteurs avec le nom d’un ancien projet. Techniquement valide ; visuellement, PortHub semblait être venu avec le passeport d’un autre.</p>
<p>Nous avons vérifié le client OAuth, les domaines autorisés et l’écran de consentement. Le Patron a remplacé le nom et le logo. Et nous avons rappelé l’essentiel : un secret client ne va jamais dans le code du navigateur.</p>
