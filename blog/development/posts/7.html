<p>Алғашқы тексеріс ұпайдың өсу жылдамдығын күмәнді деп санады. Бірақ ірі біріктірулер көбірек ұпай береді, ал пернетақтадағы ойыншы біздің болжамнан жылдамырақ қимылдайды.</p>
<p>Рекордты түсінікті ережеге ауыстырдық: бір сәтті біріктіру — бір ұпай. Сервер әдемі жіберілген санды емес, жаңарту уақытын және нақты ойын іске қосылымының тарихын қарайды.</p>
