function ptSafeValue(value){return String(value||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,48)}
function ptModuleId(){
  const path=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
  const test=ptSafeValue(new URLSearchParams(location.search).get('test'));
  if(test)return `quick_${test}`;
  const rootIndex=path.indexOf('Portable-Tests');
  const parts=path.slice(rootIndex>=0?rootIndex+1:0).filter(part=>!part.endsWith('.html'));
  return ptSafeValue(parts.join('_'))||'home';
}
function ptSafePage(){
  const test=ptSafeValue(new URLSearchParams(location.search).get('test'));
  return `${location.origin}${location.pathname}${test?`?test=${test}`:''}`;
}
function ptTrack(eventName,parameters={}){
  if(typeof window.gtag!=='function')return;
  const safe={module_id:ptModuleId(),language:ptLanguage()};
  for(const [key,value] of Object.entries(parameters))safe[key]=typeof value==='number'?value:ptSafeValue(value);
  window.gtag('event',eventName,safe);
}
function ptAnalytics(){
  if(location.protocol!=='https:'||document.querySelector(`script[data-pt-ga="${PT_GA_ID}"]`))return;
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){window.dataLayer.push(arguments)};
  window.gtag('js',new Date());
  window.gtag('config',PT_GA_ID,{send_page_view:false,anonymize_ip:true,allow_google_signals:false});
  const script=document.createElement('script');script.async=true;script.dataset.ptGa=PT_GA_ID;script.src=`https://www.googletagmanager.com/gtag/js?id=${PT_GA_ID}`;document.head.appendChild(script);
  window.gtag('event','page_view',{page_title:document.title,page_location:ptSafePage(),page_path:location.pathname,module_id:ptModuleId(),language:ptLanguage()});
  document.addEventListener('click',event=>{
    const target=event.target.closest('button,a,[data-object],[data-pin]');if(!target)return;
    let name='',extra={};
    if(target.matches('[data-pt-install]'))name='app_install_click';
    else if(target.matches('[data-pt-share]'))name='app_share';
    else if(target.matches('[data-pt-update]'))name='app_update_check';
    else if(target.matches('[data-pin]')){name='module_pin';extra.item_id=target.dataset.pin}
    else if(target.matches('.open-card,.retake-card')){name='module_open';extra.item_id=target.closest('[data-id]')?.dataset.id}
    else if(target.matches('#start'))name='test_start';
    else if(target.matches('#share,#shareResult'))name='result_share';
    else if(target.matches('#again'))name='test_restart';
    else if(target.matches('#interpret'))name='dream_interpret';
    else if(target.matches('[data-object]'))name='dream_symbol_select';
    else if(target.matches('#throw'))name='dice_throw';
    else if(target.matches('#calculate'))name='calculation_start';
    if(name)ptTrack(name,extra);
  },{capture:true});
  document.addEventListener('change',event=>{if(event.target.matches('[data-played]'))ptTrack('game_known_toggle',{item_id:event.target.dataset.played})});
  const seenResults=new WeakSet(),markResults=()=>document.querySelectorAll('.result-card,.result-page,.result-hero,.meme-result,.gamer-result,.result-head,#result:not([hidden])').forEach(node=>{if(seenResults.has(node))return;seenResults.add(node);ptTrack('result_view',{shared:location.hash.startsWith('#r=')?'yes':'no'})});

function ptEnsureSeo(){
  const url=ptSafePage(),image=`${PT_HOME}og-cover.webp`,description=document.querySelector('meta[name="description"]')?.content||'Приватные тесты и личные разборы Portable Tests — без регистрации, прямо на вашем устройстве.';

function ptLanguage(){

  try{const saved=(localStorage.getItem('pt.lang')||'').slice(0,2).toLowerCase();if(PT_LANGS.includes(saved))return saved}catch{}
  return 'ru';

function ptTheme(){
  try{return localStorage.getItem('pt.theme')==='readable'?'readable':'normal'}catch{return 'normal'}
}

function ptApplyTheme(theme){
  const value=theme==='readable'?'readable':'normal';
  document.documentElement.dataset.ptTheme=value;
  try{localStorage.setItem('pt.theme',value)}catch{}
  document.querySelectorAll('[data-pt-theme-choice]').forEach(button=>{
    const active=button.dataset.ptThemeChoice===value;
    button.classList.toggle('active',active);

function ptRemoveLegacySupport(){
  document.querySelectorAll('.support-card').forEach(element=>element.hidden=true);

function ptToast(message){
  let toast=document.querySelector('.pt-global-toast');
  if(!toast){toast=document.createElement('div');toast.className='pt-global-toast';toast.setAttribute('role','status');document.body.appendChild(toast)}
  toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900);
}

async function ptShareApp(){
  const copy=PT_COPY[ptLanguage()];
  const data={title:'Portable Tests',text:copy.text,url:PT_HOME};
  try{
    if(navigator.share)await navigator.share(data);
    else{await navigator.clipboard.writeText(PT_HOME);ptToast(copy.copied)}
  }catch(error){if(error?.name!=='AbortError')ptToast(copy.copied)}
}

function ptIsInstalled(){
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function ptInstallHelp(){
  const copy=PT_COPY[ptLanguage()],isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let dialog=document.querySelector('.pt-install-dialog');
  if(!dialog){dialog=document.createElement('dialog');dialog.className='pt-install-dialog';document.body.appendChild(dialog)}
  dialog.innerHTML=`<div class="pt-install-card"><h2>📲 ${copy.installTitle}</h2><p>${isIos?copy.iosSteps:copy.browserSteps}</p><button type="button">${copy.close}</button></div>`;
  dialog.querySelector('button').addEventListener('click',()=>dialog.close());
  dialog.showModal();
}

async function ptInstallApp(){
  const copy=PT_COPY[ptLanguage()];
  if(ptIsInstalled())return ptToast(copy.installed);
  if(!ptInstallPrompt)return ptInstallHelp();
  ptInstallPrompt.prompt();
  await ptInstallPrompt.userChoice;
  ptInstallPrompt=null;
}

async function ptUpdateApp(){
  const copy=PT_COPY[ptLanguage()];
  try{
    const registration=await navigator.serviceWorker?.getRegistration(PT_ROOT) || await navigator.serviceWorker?.register(`${PT_ROOT}service-worker.js`,{scope:PT_ROOT});
    await registration?.update();
    if(registration?.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
  }catch{}
  ptToast(copy.updating);
  setTimeout(()=>location.reload(),900);
}

function ptEnsurePwa(){
  if(!document.querySelector('link[rel="manifest"]')){const link=document.createElement('link');link.rel='manifest';link.href=`${PT_ROOT}manifest.webmanifest`;document.head.appendChild(link)}
  if(!document.querySelector('link[rel="apple-touch-icon"]')){const link=document.createElement('link');link.rel='apple-touch-icon';link.href=`${PT_ROOT}icon-192.png`;document.head.appendChild(link)}
  if(!document.querySelector('meta[name="apple-mobile-web-app-capable"]')){const meta=document.createElement('meta');meta.name='apple-mobile-web-app-capable';meta.content='yes';document.head.appendChild(meta)}
  navigator.serviceWorker?.register(`${PT_ROOT}service-worker.js`,{scope:PT_ROOT}).then(registration=>registration.update()).catch(()=>{});
}

function ptRenderFooter(){
  ptInstallStyles();ptRemoveLegacySupport();
  let footer=document.querySelector('.pt-global-footer');
  if(!footer){footer=document.createElement('footer');footer.className='pt-global-footer';document.body.appendChild(footer)}
  footer.innerHTML=ptFooterMarkup();
  footer.querySelector('[data-pt-share]').addEventListener('click',ptShareApp);
  footer.querySelector('[data-pt-install]').addEventListener('click',ptInstallApp);
  footer.querySelector('[data-pt-update]').addEventListener('click',ptUpdateApp);
  footer.querySelectorAll('[data-pt-theme-choice]').forEach(button=>button.addEventListener('click',()=>ptApplyTheme(button.dataset.ptThemeChoice)));
  ptApplyTheme(ptTheme());
}

function ptStart(){
  ptEnsureSeo();
  ptAnalytics();
  ptEnsurePwa();
  ptRenderFooter();
  let scheduled=false;
  const refresh=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;ptRemoveLegacySupport()})};
  new MutationObserver(refresh).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(ptRenderFooter).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
}

environment:{icon:'🌿',image:'../../hero-environment.webp',fun:false,title:tr('Какая среда раскрывает тебя?','Қандай орта сені ашады?','Which environment brings out your best?','Quel environnement révèle votre potentiel ?'),hook:tr('12 ситуаций · 6 условий для роста','12 жағдай · өсуге арналған 6 шарт','12 situations · 6 conditions for growth','12 situations · 6 conditions pour grandir'),intro:tr('Определите условия, в которых вам легче сохранять интерес и показывать сильные стороны.','Қызығушылықты сақтап, күшті жағыңызды көрсетуге ыңғайлы шарттарды анықтаңыз.','Identify the conditions that help you stay engaged and show your strengths.','Identifiez les conditions qui vous aident à rester engagé et à montrer vos forces.'),scales:{focus:tr('Тихий фокус','Тыныш зейін','Quiet focus','Concentration calme'),social:tr('Живое сотрудничество','Жанды ынтымақтастық','Active collaboration','Collaboration active'),freedom:tr('Свобода выбора','Таңдау еркіндігі','Freedom to choose','Liberté de choisir'),structure:tr('Ясная структура','Айқын құрылым','Clear structure','Structure claire'),hands:tr('Практика и движение','Практика және қимыл','Hands-on action','Action concrète'),pace:tr('Быстрый ритм','Жылдам ырғақ','Fast pace','Rythme rapide')},questions:[q('Я лучше думаю, когда меня долго не отвлекают','Мені ұзақ уақыт бөлмегенде жақсы ойланамын','I think best when I am not interrupted','Je réfléchis mieux sans interruptions','focus'),q('Мне нужен уголок, где можно спокойно углубиться в задачу','Тапсырмаға тыныш тереңдейтін орын керек','I need a place to quietly go deep into a task','J’ai besoin d’un lieu calme pour approfondir','focus'),q('Обсуждение с другими часто даёт мне энергию','Басқалармен талқылау маған қуат береді','Discussion with others often energizes me','Discuter avec les autres me donne de l’énergie','social'),q('Мне нравится регулярно обмениваться идеями в процессе','Жұмыс барысында ой алмасқанды ұнатамын','I like exchanging ideas throughout the process','J’aime éc battery:{icon:'🔋',fun:true,title:tr('Какой у тебя режим батарейки?','Батареяңның режимі қандай?','What is your battery mode?','Quel est votre mode batterie ?'),hook:tr('8 вопросов · серьёзность 0%','8 сұрақ · байсалдылық 0%','8 questions · 0% seriousness','8 questions · 0 % de sérieux'),intro:tr('Научно не доказано, зато подозрительно похоже. Развлекательный тест.','Ғылыми дәлелденбеген, бірақ ұқсап кетуі мүмкін. Ойын-сауық тесті.','Not scientifically proven, yet suspiciously relatable. Entertainment only.','Pas scientifique, mais étrangement ressemblant. Divertissement uniquement.'),scales:{turbo:tr('Турборежим','Турборежим','Turbo mode','Mode turbo'),balance:tr('Умный баланс','Ақылды баланс','Smart balance','Équilibre malin'),saving:tr('Энергосбережение','Қуат үнемдеу','Power saver','Économie d’énergie'),night:tr('Ночной режим','Түнгі режим','Night mode','Mode nuit')},questions:[q('Новая идея? Уже открыл три приложения и создал проект','Жаңа идея ма? Үш қолданба ашып, жоба құрдым','New idea? I already opened three apps and made a project','Nouvelle idée ? J’ai déjà ouvert trois applis et créé le projet','turbo'),q('Дедлайн включает во мне дополнительный реактор','Дедлайн қосымша реакторымды іске қосады','A deadline activates my extra reactor','Une échéance active mon réacteur bonus','turbo'),q('Я умею чередовать рывок, паузу и нормальный сон','Қарқын, үзіліс және ұйқыны кезектестіре аламын','I can alternate sprints, breaks, and real sleep','J’alterne sprint, pause et vrai sommeil','balance'),q('Мой календарь иногда даже знает правду','Күнтізбем кейде шындықты да біледі','My calendar occasionally knows the truth','Mon calendrier connaît parfois la vérité','balance'),q('После двух встреч мне нужен режим «не трогать»','Екі кездесуден кейін «мазалама» режимі керек','After two meetings I need do-not-disturb mode','Après deux réunions, il me faut le mode silencieux','saving'),q('Я берегу силы для действительно важных задач','Күшімді шын маңызды істерге сақтаймын','I save energy for what truly matters','Je garde mon énergie pour ce qui compte','saving'),q('Лучшие мысли приходят, когда нормальные люди уже спят','Жақсы ойлар басқалар ұйықтағанда келеді','My best ideas arrive when normal people are asleep','Mes meilleures idées arrivent quand tout le monde dort','night'),q('В 23:47 внезапно идеально начать новую жизнь','23:47-де жаңа өмір бастау өте орынды','At 23:47 it suddenly feels perfect to restart life','À 23 h 47, recommencer sa vie semble parfait','night')]},
tabs:{icon:'🧠',fun:true,title:tr('Кто управляет твоими 47 вкладками?','47 бетіңді кім басқарады?','Who runs your 47 tabs?','Qui dirige vos 47 onglets ?'),hook:tr('8 вопросов · цифровая археология','8 сұрақ · цифрлық археология','8 questions · digital archaeology','8 questions · archéologie numérique'),intro:tr('Разберём хаос, не закрывая ничего важного. Развлекательный тест.','Маңыздысын жаппай-ақ, ретсіздікті зерттейік. Ойын-сауық тесті.','Let’s inspect the chaos without closing anything important. Entertainment only.','Explorons le chaos sans rien fermer d’important. Divertissement uniquement.'),scales:{explorer:tr('Исследователь','Зерттеуші','Explorer','Explorateur'),collector:tr('Коллекционер идей','Идея жинаушы','Idea collector','Collectionneur d’idées'),deadline:tr('Укротитель дедлайна','Дедлайн бағындырушы','Deadline tamer','Dominateur des délais'),minimal:tr('Цифровой минималист','Цифрлық минималист','Digital minimalist','Minimaliste numérique')},questions:[q('Одна статья ведёт к пяти новым вопросам — всё по плану','Бір мақала бес жаңа сұраққа әкеледі — жоспар бойынша','One article leads to five new questions—as planned','Un article mène à cinq questions : tout va bien','explorer'),q('Я открываю вкладку, чтобы понять тему когда-нибудь полностью','Тақырыпты бір күні толық түсіну үшін бетті ашамын','I open a tab to understand the topic fully someday','J’ouvre un onglet pour tout comprendre un jour','explorer'),q('Закладка — это обещание будущему себе','Бетбелгі — болашақтағы өзіме уәде','A bookmark is a promise to my future self','Un favori est une promesse à mon futur moi','collector'),q('У меня есть папка «полезное», внутри ещё семь папок','Менде «пайдалы» деген бума бар, ішінде тағы жеті бума','I have a “useful” folder containing seven more folders','J’ai un dossier « utile » avec sept sous-dossiers','collector'),q('За час до срока вкладки внезапно строятся в боевой порядок','Мерзімге бір сағат қалғанда беттер сапқа тұрады','An hour before deadline, tabs form battle order','Une heure avant l’échéance, les onglets se mettent au garde-à-vous','deadline'),q('Мой хаос становится системой, когда уже очень надо','Өте қажет кезде ретсіздігім жүйеге айналады','My chaos becomes a system when it absolutely must','Mon chaos devient un système quand il le faut vraiment','deadline'),q('Если вкладка не нужна сейчас, я закрываю её без церемоний','Бет қазір керек болмаса, бірден жабамын','If a tab is not useful now, I close it without ceremony','Si un onglet ne sert pas maintenant, je le ferme','minimal'),q('Чистый браузер дарит мне внутренний покой','Таза браузер маған ішкі тыныштық береді','A clean browser gives me inner peace','Un navigateur propre m’apporte la paix intérieure','minimal')]},
animal:{icon:'🐾',fun:true,title:tr('Какое ты животное в интернете?','Интернетте сен қай жануарсың?','Which internet animal are you?','Quel animal d’Internet es-tu ?'),hook:tr('8 вопросов · мемометр включён','8 сұрақ · мем өлшегіш қосылды','8 questions · meme meter on','8 questions · détecteur de mèmes activé'),intro:tr('Выясним, кто сидит по ту сторону экрана. Спойлер: человек там не всегда. Развлекательный тест.','Экранның ар жағында кім отырғанын білейік. Спойлер: ол әрдайым адам емес. Ойын-сауық тесті.','Let’s find out who is really behind the screen. Spoiler: not always a human. Entertainment only.','Découvrons qui est vraiment derrière l’écran. Spoiler : pas toujours un humain. Pour rire.'),scales:{cat:tr('Кот-эксперт','Сарапшы мысық','Expert cat','Chat expert'),capybara:tr('Капибара-дипломат','Капибара-дипломат','Capybara diplomat','Capybara diplomate'),raccoon:tr('Енот-исследователь','Зерттеуші жанат','Raccoon explorer','Raton laveur explorateur'),owl:tr('Сова-наблюдатель','Бақылаушы үкі','Observer owl','Hibou observateur')},questions:[q('Сначала посмотрю со стороны. Потом решу, достойно ли это моего внимания','Алдымен сырттан қараймын. Сосын назар аударуға тұра ма, шешемін','I watch first, then decide if this deserves my attention','J’observe d’abord, puis je décide si cela mérite mon attention','cat'),q('Если я лёг удобно, планы официально отменяются','Ыңғайланып жатсам, жоспар ресми түрде тоқтайды','If I get comfortable, all plans are officially canceled','Si je suis bien installé, tous les projets sont annulés','cat'),q('В споре я предпочитаю чай, мир и чтобы все немного успокоились','Дауда шайды, тыныштықты және бәрінің сабырға келгенін қалаймын','In an argument, I prefer tea, peace, and everyone calming down','En cas de dispute, je choisis le thé, la paix et le calme','capybara'),q('Я могу подружиться даже с человеком, который пишет голосовые на восемь минут','Сегіз минуттық дауыстық хабарлама жіберетін адаммен де дос бола аламын','I can befriend even someone who sends eight-minute voice notes','Je peux même devenir ami avec quelqu’un qui envoie huit minutes de vocal','capybara'),q('Что в этой кнопке? Узнаем только одним способом','Бұл батырма не істейді? Бір-ақ жолмен білеміз','What does this button do? There is only one way to find out','Que fait ce bouton ? Il n’y a qu’une façon de le savoir','raccoon'),q('Мне не нужен этот странный файл. Поэтому я уже его скачал','Бұл қызық файл маған керек емес. Сол себепті жүктеп қойдым','I do not need this strange file. That is why I already downloaded it','Je n’ai pas besoin de ce fichier étrange. Voilà pourquoi je l’ai téléchargé','raccoon'),q('Пока все шумят, я уже понял, что происходит','Бәрі шулап жатқанда, не болып жатқанын түсініп қойдым','While everyone is loud, I already understand what is happening','Pendant que tout le monde parle, j’ai déjà compris','owl'),q('Моя активность начинается примерно тогда, когда другие пишут «спокойной ночи»','Басқалар «қайырлы түн» дегенде менің белсенділігім басталады','My activity begins when others say good night','Je deviens actif quand les autres disent bonne nuit','owl')]},lifeAnimal:{icon:'🌍',fun:true,title:tr('Какое вы животное по жизни?','Өмірде сіз қай жануарсыз?','Which animal are you in life?','Quel animal êtes-vous dans la vie ?'),hook:tr('16 жизненных ситуаций · 4 характера','16 өмірлік жағдай · 4 мінез','16 life situations · 4 personalities','16 situations de vie · 4 caractères'),intro:tr('Кто живёт внутри вас: верный волк, находчивая лиса, надёжный медведь или общительный дельфин? Развлекательный тест, но совпадения могут быть подозрительно точными.','Ішіңізде кім өмір сүреді: адал қасқыр, тапқыр түлкі, сенімді аю немесе көпшіл дельфин? Бұл әзіл тест, бірақ кейде өте дәл келеді.','Who lives inside you: a loyal wolf, resourceful fox, dependable bear, or social dolphin? Just for fun, but sometimes suspiciously accurate.','Qui vit en vous : loup fidèle, renard débrouillard, ours fiable ou dauphin sociable ? Pour rire, mais parfois étonnamment juste.'),scales:{wolf:tr('Волк — свой человек','Қасқыр — сенімді серік','Wolf — loyal ally','Loup — allié fidèle'),fox:tr('Лиса — мастер хода','Түлкі — амал шебері','Fox — master improviser','Renard — maître de l’improvisation'),bear:tr('Медведь — надёжный тыл','Аю — сенімді тірек','Bear — The Solid Anchor','Ours — pilier solide'),dolphin:tr('Дельфин — душа компании','Дельфин — ортаның сәні','Dolphin — life of the party','Dauphin — âme de la fête')},questions:[q("Если близкому человеку нужна помощь, я подключаюсь без долгих разговоров","Жақын адамға көмек керек болса, көп сөзсіз көмектесемін","When someone close needs help, I step in without a long discussion","Quand un proche a besoin d’aide, j’interviens sans longs discours","wolf"),q("Мне важно чувствовать, что рядом есть свои люди","Жанымда өз адамдарым барын сезіну маңызды","It matters to me to have my people nearby","Il est important pour moi d’avoir mes proches à mes côtés","wolf"),q("В общей поездке я незаметно слежу, чтобы никто не потерялся","Ортақ сапарда ешкім жоғалмасын деп байқатпай қадағалаймын","On a group trip, I quietly make sure nobody gets lost","En voyage de groupe, je vérifie discrètement que personne ne se perde","wolf"),q("Если наступают трудные времена, я собираюсь и держу удар","Қиын кезеңде өзімді жинап, төтеп беремін","When times get hard, I pull myself together and hold steady","Quand les temps sont durs, je me rassemble et je tiens bon","wolf"),q("Когда план ломается, я быстро придумываю другой путь","Жоспар бұзылса, басқа жолды тез табамын","When a plan breaks, I quickly find another route","Quand un plan échoue, je trouve vite une autre voie","fox"),q("Я умею подобрать правильные слова для разных людей","Әртүрлі адамға дұрыс сөз таба аламын","I can find the right words for different people","Je sais trouver les bons mots selon la personne","fox"),q("В незнакомой ситуации сначала ищу возможности, а не проблемы","Бейтаныс жағдайда алдымен қиындықты емес, мүмкіндікті іздеймін","In an unfamiliar situation, I look for opportunities before problems","Dans une situation inconnue, je cherche d’abord les possibilités","fox"),q("Часто я выкручиваюсь так, что потом сам удивляюсь","Көбіне тығырықтан өзім де таңғалатындай шығып кетемін","I often improvise so well that I surprise myself","Je me débrouille souvent si bien que je me surprends moi-même","fox"),q("Мой идеальный отдых начинается со слов «никуда не надо»","Менің тамаша демалысым «ешқайда барудың қажеті жоқ» дегеннен басталады","My ideal rest begins with “nowhere to go”","Mon repos idéal commence par « nul besoin de sortir »","bear"),q("Я люблю, когда дома спокойно, тепло и есть что-нибудь вкусное","Үйде тыныш, жылы әрі дәмді нәрсе болғанын ұнатамын","I like home to be calm, warm, and stocked with something tasty","J’aime quand la maison est calme, chaleureuse et pleine de bonnes choses","bear"),q("Своих людей я защищаю, даже если обычно выгляжу очень мирно","Әдетте тыныш көрінсем де, өз адамдарымды қорғаймын","I protect my people even if I usually look very peaceful","Je protège les miens même si j’ai l’air très paisible","bear"),q("Мне проще сделать надёжно и основательно, чем быстро и кое-как","Тез әрі шала емес, сенімді әрі тиянақты жасағанды ұнатамын","I would rather do it solidly than quickly and poorly","Je préfère faire les choses solidement que vite et mal","bear"),q("Я легко оживляю компанию, даже если сначала никто не разговаривал","Басында ешкім сөйлемесе де, ортаны тез жандандырамын","I easily bring a group to life even when nobody was talking","Je mets facilement de l’ambiance même quand personne ne parlait","dolphin"),q("Мне нравится делиться хорошими новостями и заражать других настроением","Жақсы жаңалықпен бөлісіп, өзгелерге көңіл күй сыйлағанды ұнатамын","I enjoy sharing good news and spreading the mood","J’aime partager les bonnes nouvelles et transmettre mon enthousiasme","dolphin"),q("Новая компания для меня — скорее приключение, чем испытание","Жаңа орта мен үшін сынақтан гөрі қызық оқиға","A new group feels more like an adventure than a test","Un nouveau groupe ressemble plus à une aventure qu’à une épreuve","dolphin"),q("Даже серьёзное дело идёт лучше, если в нём есть место шутке","Маңызды істің өзі әзілге орын болса жақсы жүреді","Even serious work goes better when there is room for a joke","Même un travail sérieux avance mieux avec une place pour l’humour","dolphin")]}}
tests.gamer={icon:'🎮',fun:false,profiled:true,title:tr('Какой вы игрок — и что вам реально зайдёт?','Сіз қандай ойыншысыз — сізге не ұнайды?','What kind of player are you—and what will you enjoy?','Quel type de joueur êtes-vous — et quels jeux vous plairont ?'),hook:tr('18 игровых ситуаций · личная подборка игр','18 ойын жағдайы · жеке ойындар топтамасы','18 gaming situations · a personal game list','18 situations de jeu · une sélection personnelle'),intro:tr('Не экзамен на «настоящего геймера». По привычным игровым решениям определим ваши любимые жанры и соберём игры, которые стоит попробовать.','Бұл «нағыз геймер» емтиханы емес. Ойындағы әдеттегі таңдауларыңыз арқылы жанрларыңызды анықтап, көруге тұрарлық ойындарды ұсынамыз.','This is not a “real gamer” exam. Your usual in-game choices reveal your favorite genres and games worth trying.','Ce n’est pas un examen de « vrai gamer ». Vos choix habituels révèlent les genres et les jeux à essayer.'),scales:{tactician:tr('Тактик','Тактик','Tactician','Tacticien'),explorer:tr('Исследователь миров','Әлем зерттеушісі','World explorer','Explorateur de mondes'),builder:tr('Создатель','Жасаушы','Creator','Créateur'),connector:tr('Командный игрок','Командалық ойыншы','Team player','Joueur d’équipe'),competitor:tr('Охотник за мастерством','Шеберлік аңшысы','Skill chaser','Chasseur de maîtrise'),story:tr('Охотник за историями','Оқиға аңшысы','Story seeker','Chercheur d’histoires')},questions:[
q('Перед сложной миссией я сначала изучаю карту, способности и слабые места противника','Күрделі миссия алдында карта, қабілеттер және қарсыластың әлсіз тұстарын зерттеймін','Before a hard mission, I study the map, abilities, and enemy weaknesses','Avant une mission difficile, j’étudie la carte, les capacités et les faiblesses ennemies','tactician'),q('Мне нравится выигрывать не скоростью реакции, а удачным планом','Маған реакция жылдамдығымен емес, дұрыс жоспармен жеңген ұнайды','I enjoy winning through a smart plan more than fast reflexes','J’aime gagner grâce à un bon plan plutôt qu’aux réflexes','tactician'),q('После поражения я меняю сборку или стратегию и проверяю ещё раз','Жеңілістен кейін жинақты немесе стратегияны өзгертіп, қайта тексеремін','After losing, I change my build or strategy and test again','Après une défaite, je change mon build ou ma stratégie et je réessaie','tactician'),
q('Если игра ставит метку справа, мне всё равно хочется проверить, что находится слева','Ойын оң жаққа белгі қойса да, сол жақта не барын тексергім келеді','If the marker points right, I still want to see what is on the left','Même si le marqueur indique la droite, je veux voir ce qu’il y a à gauche','explorer'),q('Я могу надолго забыть о сюжете, исследуя необязательную пещеру или район','Қосымша үңгірді не ауданды зерттеп, сюжетті ұзаққа ұмытып кетуім мүмкін','I can forget the main story while exploring an optional cave or district','Je peux oublier l’histoire principale en explorant une grotte ou un quartier facultatif','explorer'),q('В игре меня сильнее всего цепляет ощущение нового мира и свободы','Ойында мені жаңа әлем мен еркіндік сезімі көбірек тартады','A new world and a sense of freedom excite me most','Un nouveau monde et la liberté m’attirent le plus','explorer'),
q('Мне нравится строить базу, дом, ферму или собственную систему','База, үй, ферма немесе өз жүйемді құруды ұнатамын','I like building a base, home, farm, or my own system','J’aime construire une base, une maison, une ferme ou mon propre système','builder'),q('Редактор персонажа или мира легко забирает у меня больше времени, чем планировалось','Кейіпкер не әлем редакторы ойлағанымнан көп уақытымды алады','A character or world editor easily takes more time than planned','Un éditeur de personnage ou de monde me prend facilement plus de temps que prévu','builder'),q('Мне приятно видеть, как пустое место постепенно превращается в работающий проект','Бос орынның біртіндеп жұмыс істейтін жобаға айналғанын көру ұнайды','I enjoy watching an empty space become a working project','J’aime voir un espace vide devenir peu à peu un projet fonctionnel','builder'),
q('Лучшие игровые моменты для меня — когда мы с друзьями спасаем друг друга в последнюю секунду','Мен үшін ең жақсы сәт — достарыммен бір-бірімізді соңғы секундта құтқару','My best moments are when friends save each other at the last second','Mes meilleurs moments sont ceux où mes amis et moi nous sauvons à la dernière seconde','connector'),q('Мне нравится брать роль, которая делает всю команду сильнее','Бүкіл команданы күшейтетін рөлді алғанды ұнатамын','I like taking a role that makes the whole team stronger','J’aime choisir un rôle qui rend toute l’équipe plus forte','connector'),q('Даже смешной провал с друзьями иногда ценнее идеальной победы в одиночку','Достармен күлкілі сәтсіздік жалғыз мінсіз жеңістен қымбат болуы мүмкін','A funny failure with friends can beat a perfect solo victory','Un échec drôle entre amis peut valoir mieux qu’une victoire solo parfaite','connector'),
q('Мне нравится замечать, что сегодня я играю точнее, чем неделю назад','Бүгін өткен аптадан дәлірек ойнағанымды байқау ұнайды','I like noticing that I play better today than a week ago','J’aime constater que je joue mieux aujourd’hui qu’il y a une semaine','competitor'),q('Сложный босс скорее заводит меня, чем заставляет сразу уйти','Қиын босс мені бірден кетірмей, керісінше жігерлендіреді','A hard boss motivates me more than it makes me quit','Un boss difficile me motive plus qu’il ne me fait abandonner','competitor'),q('Рейтинг, время прохождения или сложное достижение дают мне понятную цель','Рейтинг, уақыт немесе күрделі жетістік маған анық мақсат береді','Rank, completion time, or a hard achievement gives me a clear target','Un classement, un temps ou un succès difficile me donne un objectif clair','competitor'),
q('Я запоминаю персонажей и их выборы дольше, чем характеристики оружия','Қару сипаттарынан гөрі кейіпкерлер мен олардың таңдауын ұзақ есте сақтаймын','I remember characters and their choices longer than weapon stats','Je me souviens des personnages et de leurs choix plus longtemps que des statistiques d’armes','story'),q('Если решение меняет сюжет, я долго думаю перед нажатием кнопки','Шешім оқиғаны өзгертсе, батырманы басар алдында ұзақ ойланамын','If a choice changes the story, I think before pressing the button','Si un choix change l’histoire, je réfléchis avant d’appuyer','story'),q('Хороший мир хочется обсуждать после финальных титров','Жақсы әлемді финалдан кейін де талқылағың келеді','A good world stays worth discussing after the credits','Un bon univers donne encore envie d’en parler après le générique','story')]};

const funProfiles={battery:{turbo:{emoji:'🚀',desc:tr('Ты включаешься раньше, чем загрузился план. Твоя суперсила — запускать движение.','Жоспар жүктелмей жатып іске кірісесің. Күшің — қозғалыс бастау.','You start before the plan finishes loading. Your power is creating momentum.','Tu démarres avant même que le plan soit chargé. Ton pouvoir : lancer le mouvement.')},balance:{emoji:'⚖️',desc:tr('Ты умеешь и разогнаться, и вовремя найти зарядку. Редкий взрослый навык.','Қарқын алып, уақытында қуат жинай аласың. Сирек кездесетін қабілет.','You can sprint and still find the charger in time. A rare grown-up skill.','Tu sais accélérer et trouver le chargeur à temps. Un talent rare.')},saving:{emoji:'🌱',desc:tr('Ты не ленишься — ты грамотно распределяешь ресурс. Не трогать до появления важной миссии.','Сен жалқау емессің — күшіңді дұрыс бөлесің. Маңызды миссияға дейін мазаламау керек.','You are not lazy—you allocate resources wisely. Do not disturb until the mission matters.','Tu n’es pas paresseux : tu gères tes ressources. À réveiller pour une vraie mission.')},night:{emoji:'🌙',desc:tr('Днём система обновляется, ночью открывается портал идей. Главное — иногда всё-таки спать.','Күндіз жүйе жаңарады, түнде идеялар порталы ашылады. Кейде ұйықтауды ұмытпа.','The system updates by day; the idea portal opens at night. Remember to sleep sometimes.','Le système se met à jour le jour, le portail des idées s’ouvre la nuit. Pense à dormir.')}},tabs:{explorer:{emoji:'🧭',desc:tr('Каждая вкладка — новая экспедиция. Вернуться домой можно, но зачем?','Әр бет — жаңа сапар. Үйге қайтуға болады, бірақ не үшін?','Every tab is a new expedition. You could go home, but why?','Chaque onglet est une expédition. Tu pourrais rentrer, mais pourquoi ?')},collector:{emoji:'🗃️',desc:tr('Ты не копишь вкладки — ты создаёшь музей будущих великих идей.','Сен беттерді жинамайсың — болашақ ұлы идеялардың мұражайын жасайсың.','You do not hoard tabs; you curate a museum of future great ideas.','Tu n’accumules pas les onglets : tu crées un musée des futures grandes idées.')},deadline:{emoji:'🔥',desc:tr('До дедлайна хаос отдыхает. Потом ты собираешь из него работающий космолёт.','Дедлайнға дейін ретсіздік демалады. Кейін одан ғарыш кемесін құрастырасың.','Chaos rests until the deadline. Then you build a working spaceship from it.','Le chaos se repose jusqu’à l’échéance. Puis tu en fais un vaisseau spatial.')},minimal:{emoji:'✨',desc:tr('Три вкладки. Чистый рабочий стол. Остальные смотрят на тебя с уважением и страхом.','Үш бет. Таза жұмыс үстелі. Басқалар саған құрметпен әрі қорқынышпен қарайды.','Three tabs. Clean desktop. Everyone else looks at you with respect and fear.','Trois onglets. Bureau propre. Les autres te regardent avec respect et peur.')}},animal:{cat:{emoji:'🐈',image:'data:image/webp;base64,UklGRkKXAQBXRUJQVlA4IDaXAQDQFgidASqwBLAEPm00lUgkIqutpTUqabANiWU6IbRiuGP1R3PbX/ZeMbnvv+auVP0z/MeA/+p43HqP+39gP+c/3X1ALdT2EfMqzU6P3/j9QT7C6MDV//R3kGj9U/ny8z8wPSz4wVW/LL7oM03pHPb9j+8H3a/K71P+MT/yvZf61POV/Vv+X+6Xu8ebl6iv9h9Pf11/Sf6aj+s/970k///rBXwr/5egL45/if/Pwt8733j+G/0f/49nvQn3CalPln/08//2x8mfn1qHYlf8/vx+B/5X/z/3vsR+HfP8/a8+/5T1BP7f/sfW//0eJn/O/8vsFeTj/wf/70D/ZXsJfstv6BPNnO0fAE+TW35CAUF16arBu9Nk2wGF+5KsKk1Q7VbdK8qnnix4CDnG3Mmxduc0dsBMJJypVoH63M4sw/9NCCkgXWuDGDzV4QDb/HKP+NqzRsq5FXqqyPC29mxyLe6omM7o3HulDPmBiTQyDHn1GSxw98eJ5FCYHWTA62E+CwXzFQdDsnAqeJpls6IQ3ZaIgTucuHz02xW66roB3vYN0DxeZYKZiUyLVTpFDNf0Ou3HJllOl5SAhATWJW6BXv6BqHFmGPyvt4EAuL11PXL/0/2vEI37OXkcQexGCOc58lO12uMaOVqIWohA09n0SmlpIXvrmz7WM1gWZFpYXJv/V8hxof00fvJOZwzyOxitzjpi1fe/7pdTZZLkcDNXVOaHwhSP5kvG5qyhgeqJ+Er8eQrqQQSfLz0RCZP+X82OGyM43DXPmTn1eToNyTu658gSHZ1r/qKeqtzqpRdNMG7cHW2s3s9+Uwxe6/PDR7sB2+Da1pWKUb7WZ+GgbZ495buMqYkhy2eL+Gx7z5gV3D2K3Sz2d3g8ehNWHK3Vn8sceCpHRV99bkJkSnUx+0EIxJbC9uHSpiW+yTMNewtS9dnj9HCAB48W45BDOhCMzysmlUFwyI0+Emlof3OiE4IERLuXI8cg9JXhrJck/V7r5ClSA++unxAWSHA0jr3jXfAIB6TsaBcWrvq5GLWxxHilLXYEeD1aTpTwpXnKUyVvhbk51fgY2aYWahAL6KjjtKsXiZZjdhfv7qtR+Cfs50N9kgpAU7yYVhZVf0pvPb/pWkmTPMROV10RDxcuvRJch+hq030edhSjgdLTA1 ткрываете ноутбук и внезапно понимаете устройство Вселенной. В общий чат заходите редко, зато одной фразой закрываете спор на сорок сообщений.','Көп көріп, аз сөйлейсің де, бәрін түсіндіретін бір ауыз сөз айтасың.','You see more, say less, then drop one sentence that explains everything.','Tu vois plus, tu parles moins, puis tu dis la phrase qui explique tout.')}},lifeAnimal:{wolf:{emoji:'🐺',image:'../../meme-life-wolf.webp',desc:tr('Вы из тех, кто сначала проверит, все ли добрались домой, и только потом вспомнит о себе. Своих не бросаете, хаос собираете в стаю, а фразу «разберёмся» произносите так, что действительно становится спокойнее.','Алдымен бәрі үйіне жетті ме деп тексеріп, кейін өзіңізді ойлайсыз. Жақындарыңызды тастамайсыз, ретсіздікті топқа айналдырасыз.','You make sure everyone gets home before remembering yourself. You never abandon your people and can turn chaos into a pack with one calm “we’ll handle it.”','Vous vérifiez que tout le monde est rentré avant de penser à vous. Vous ne laissez personne derrière et transformez le chaos en meute.')},fox:{emoji:'🦊',image:'../../meme-life-fox.webp',desc:tr('План А исчез? Отлично, у вас уже есть план Б, красивое объяснение и запасной выход. Вы не хитрите — вы творчески договариваетесь с реальностью. Иногда реальность даже не замечает, как согласилась.','А жоспары жоғалды ма? Сізде Б жоспары, әдемі түсініктеме және қосымша жол дайын. Сіз шындықпен шығармашылықпен келісесіз.','Plan A vanished? Great—you already have plan B, a convincing explanation, and a side exit. You do not cheat; you negotiate creatively with reality.','Le plan A a disparu ? Parfait : vous avez déjà un plan B, une belle explication et une sortie de secours.')},bear:{emoji:'🐻',image:'../../meme-life-bear.webp',desc:tr('Вы выглядите спокойно, пока кто-нибудь не тронул ваших людей, ваш сон или последний кусок вкусного. На вас можно опереться, у вас можно согреться, но важные переговоры лучше начинать после обеда.','Біреу жақындарыңызға, ұйқыңызға немесе соңғы дәмді тағамға тимесе, сабырлысыз. Сізге сенуге болады, бірақ маңызды әңгімені түстен кейін бастаған дұрыс.','You are calm until someone touches your people, your sleep, or the last snack. You are dependable and warm—but serious negotiations should begin after lunch.','Vous êtes calme tant qu’on ne touche pas à vos proches, votre sommeil ou la dernière gourmandise. On peut compter sur vous, mais les négociations importantes attendront après le déjeuner.')},dolphin:{emoji:'🐬',image:'../../meme-life-dolphin.webp',desc:tr('Вы входите в комнату — и у комнаты внезапно появляется настроение. Умеете знакомить незнакомых, превращать обычный день в историю и смеяться так, что подключается соседний столик. Главное — иногда всплывать подышать и отдыхать.','Сіз бөлмеге кіргенде, көңіл күй бірге кіреді. Бейтаныстарды таныстырып, жай күнді оқиғаға айналдырасыз. Кейде демалуды ұмытпаңыз.','You enter a room and the room suddenly has a mood. You connect strangers and turn an ordinary day into a story. Remember to surface and rest sometimes.','Vous entrez dans une pièce et l’ambiance arrive avec vous. Vous reliez les inconnus et transformez une journée ordinaire en histoire. Pensez aussi à vous reposer.')}}};
funProfiles.gamer={tactician:{emoji:'♟️',desc:tr('Вы любите понимать систему и находить ход, после которого сложная задача внезапно становится решаемой. Вам нужны игры, где план действительно что-то меняет.','Сіз жүйені түсініп, күрделі мәселені шешетін жүрісті тапқанды ұнатасыз. Жоспар маңызды болатын ойындар сізге сай.','You like understanding systems and finding the move that makes a hard problem solvable. You need games where the plan matters.','Vous aimez comprendre les systèmes et trouver le coup qui rend un problème difficile résoluble.')},explorer:{emoji:'🧭',desc:tr('Ваш главный двигатель — любопытство. Хорошая игра не ведёт вас за руку, а оставляет дверь, тропу и вопрос: «А что там?»','Сіздің басты қозғаушыңыз — қызығушылық. Жақсы ойын сізді жетелемей, «онда не бар?» деген сұрақ қалдырады.','Curiosity is your main engine. A good game leaves a door, a path, and one question: “What is over there?”','Votre moteur principal est la curiosité. Un bon jeu laisse une porte, un chemin et une question : « Qu’y a-t-il là-bas ? »')},builder:{emoji:'🧱',desc:tr('Вам нравится оставлять после себя мир, базу или систему, которые работают именно так, как вы задумали. Процесс создания для вас уже награда.','Сіз ойлағандай жұмыс істейтін әлем, база немесе жүйе жасағанды ұнатасыз. Құрудың өзі — марапат.','You enjoy leaving behind a world, base, or system that works the way you imagined. Building is its own reward.','Vous aimez créer un monde, une base ou un système qui fonctionne comme vous l’avez imaginé.')},connector:{emoji:'🤝',desc:tr('Для вас игра становится сильнее, когда в ней появляется общий момент: спасение в последний миг, смешной провал или победа, которую есть с кем вспомнить.','Сіз үшін ойын ортақ сәттермен күшейеді: соңғы сәттегі құтқару, күлкілі сәтсіздік немесе бірге еске алатын жеңіс.','Games become better when the moment is shared: a last-second save, a funny failure, or a win worth remembering together.','Pour vous, le jeu devient meilleur lorsqu’un moment est partagé : sauvetage, échec drôle ou victoire commune.')},competitor:{emoji:'🎯',desc:tr('Вас цепляет не чужое поражение, а ощущение собственного роста: точнее, быстрее, умнее, чем вчера. Хорошая сложность для вас — понятный вызов.','Сізді біреудің жеңілісі емес, өз өсуіңіз қызықтырады: кешегіден дәлірек, жылдамырақ, ақылдырақ.','You are driven less by someone else losing than by your own growth: sharper, faster, smarter than yesterday.','Ce qui vous motive, c’est moins la défaite des autres que votre propre progression : plus précis, plus rapide, plus malin.')},story:{emoji:'📖',desc:tr('Вам нужен не просто набор уровней, а мир, у которого есть характер. Вы помните выборы, отношения и финалы — значит, история для вас часть игрового процесса.','Сізге деңгейлер жиыны емес, мінезі бар әлем керек. Таңдаулар, қарым-қатынастар мен финалдар есіңізде қалады.','You need more than levels: you want a world with personality. Choices, relationships, and endings are part of play for you.','Vous voulez plus qu’une suite de niveaux : un univers avec une personnalité, des choix et des relations.')}};

  games:[
    {id:'minecraft',title:'Minecraft',icon:'⛏️',traits:['builder','explorer','connector'],genre:tr('Песочница','Құмсалғыш','Sandbox','Bac à sable'),desc:tr('Свобода строить, исследовать и играть одному или вместе. Особенно точное попадание, если вам важнее собственная цель, чем указатель на карте.','Жалғыз не бірге құруға және зерттеуге еркіндік береді. Дайын бағыттан гөрі өз мақсатыңыз маңызды болса, дәл келеді.','Freedom to build, explore, and play solo or together—ideal when your own goal matters more than a quest marker.','Liberté de construire, explorer et jouer seul ou ensemble, idéale si votre objectif compte plus qu’un marqueur.'),url:'https://www.minecraft.net/'},
    {id:'bg3',title:"Baldur’s Gate 3",icon:'🐉',traits:['story','tactician','explorer'],genre:tr('Сюжетная RPG','Оқиғалы RPG','Story RPG','RPG narratif'),desc:tr('Сложные решения, тактические бои и мир, который замечает ваши действия. Подойдёт тем, кто хочет и думать, и влиять на историю.','Күрделі шешімдер, тактикалық шайқастар және ісіңізге жауап беретін әлем. Ойлап, оқиғаға әсер еткісі келетіндерге сай.','Hard choices, tactical fights, and a world that reacts to you—strong for players who want to think and shape the story.','Choix difficiles, combats tactiques et monde réactif : parfait pour réfléchir et façonner l’histoire.'),url:'https://baldursgate3.game/'},
    {id:'hades2',title:'Hades II',icon:'🌙',traits:['competitor','story','tactician'],genre:tr('Экшен-рогалик','Экшен-рогалик','Action roguelike','Roguelike d’action'),desc:tr('Короткие напряжённые забеги, заметный рост мастерства и история, которая раскрывается между попытками.','Қысқа қарқынды жорықтар, шеберліктің өсуі және әр әрекет арасында ашылатын оқиға.','Focused runs, visible skill growth, and a story that unfolds between attempts.','Des parties intenses, une maîtrise visible et une histoire qui progresse entre les tentatives.'),url:'https://www.supergiantgames.com/games/hades-ii/'},
    {id:'split-fiction',title:'Split Fiction',icon:'🪄',traits:['connector','explorer','story'],genre:tr('Кооперативное приключение','Кооперативтік шытырман','Co-op adventure','Aventure coopérative'),desc:tr('Игра строго на двоих: постоянно меняет правила и даёт много моментов, которые хочется обсуждать вместе.','Екі адамға арналған ойын: ережелер жиі өзгеріп, бірге талқылайтын сәттер көп болады.','Built for two, constantly changing its rules and creating moments worth talking about together.','Pensé pour deux, changeant sans cesse ses règles et créant des moments à partager.'),url:'https://www.ea.com/games/split-fiction/split-fiction'},
    {id:'stardew',title:'Stardew Valley',icon:'🌱',traits:['builder','story','connector'],genre:tr('Ферма и жизнь','Ферма және өмір','Farming life sim','Simulation de ferme'),desc:tr('Спокойное развитие своего места, понятный ритм и персонажи, с которыми постепенно возникает история.','Өз орныңызды баяу дамыту, түсінікті ырғақ және біртіндеп ашылатын кейіпкерлер оқиғасы.','A calm place to grow, a clear rhythm, and characters whose stories unfold over time.','Un lieu à développer tranquillement, un rythme clair et des personnages qui se dévoilent peu à peu.'),url:'https://www.stardewvalley.net/'},
    {id:'factorio',title:'Factorio',icon:'⚙️',traits:['builder','tactician'],genre:tr('Автоматизация','Автоматтандыру','Automation','Automatisation'),desc:tr('Для удовольствия от идеально работающей системы: построить, найти узкое место, улучшить и внезапно обнаружить, что прошло три часа.','Мінсіз жұмыс істейтін жүйеден ләззат алу: құру, әлсіз жерді табу, жақсарту — үш сағаттың қалай өткенін байқамау.','For the joy of a working system: build it, find the bottleneck, improve it, then notice three hours vanished.','Pour le plaisir d’un système parfait : construire, repérer le goulot, améliorer… puis perdre trois heures.'),url:'https://factorio.com/'},
    {id:'civ7',title:'Sid Meier’s Civilization VII',icon:'🏛️',traits:['tactician','builder','explorer'],genre:tr('Пошаговая стратегия','Кезеңдік стратегия','Turn-based strategy','Stratégie au tour par tour'),desc:tr('Большие планы, развитие цивилизации и решения с последствиями через десятки ходов. Для тех, кому нравится видеть всю доску.','Үлкен жоспарлар, өркениетті дамыту және ондаған жүрістен кейін әсер ететін шешімдер.','Big plans, a civilization to shape, and decisions that echo dozens of turns later.','De grands plans, une civilisation à façonner et des décisions qui résonnent des dizaines de tours plus tard.'),url:'https://civilization.2k.com/civ-vii/'},
    {id:'fortnite',title:'Fortnite',icon:'🚌',traits:['competitor','connector','builder'],genre:tr('Командный экшен','Командалық экшен','Team action','Action en équipe'),desc:tr('Быстрые матчи, командные истории и много способов улучшать навык. Подойдёт, если вам важны движение и совместные победы.','Жылдам матчтар, командалық оқиғалар және шеберлікті өсіру жолдары көп.','Fast matches, team stories, and many ways to improve—good when movement and shared wins matter.','Matchs rapides, histoires d’équipe et nombreuses façons de progresser.'),url:'https://www.fortnite.com/'},
    {id:'valorant',title:'VALORANT',icon:'🎯',traits:['competitor','tactician','connector'],genre:tr('Тактический шутер','Тактикалық шутер','Tactical shooter','Jeu de tir tactique'),desc:tr('Точность важна, но без информации, ролей и плана команда далеко не уйдёт. Хорошо ложится на сочетание мастерства и тактики.','Дәлдік маңызды, бірақ ақпарат, рөл және жоспарсыз команда алысқа бармайды.','Aim matters, but information, roles, and a plan matter too—strong for a blend of mastery and tactics.','La précision compte, mais aussi l’information, les rôles et le plan.'),url:'https://playvalorant.com/'},
    {id:'genshin',title:'Genshin Impact',icon:'✨',traits:['explorer','story','collector'],genre:tr('Приключенческая RPG','Шытырман RPG','Adventure RPG','RPG d’aventure'),desc:tr('Большой мир, персонажи и постоянное чувство «за следующим холмом что-то есть». Подойдёт любителям исследования и длинных историй.','Үлкен әлем, кейіпкерлер және «келесі төбенің ар жағында бірдеңе бар» сезімі.','A large world, many characters, and a constant sense that something waits beyond the next hill.','Un vaste monde, de nombreux personnages et la sensation qu’une découverte attend derrière la prochaine colline.'),url:'https://genshin.hoyoverse.com/'},
    {id:'no-mans-sky',title:"No Man’s Sky",icon:'🚀',traits:['explorer','builder'],genre:tr('Космическая песочница','Ғарыш құмсалғышы','Space sandbox','Bac à sable spatial'),desc:tr('Планеты, базы и собственный маршрут без давления идти «правильно». Хорошо для исследователя, которому нравится ещё и создавать.','Планеталар, базалар және «дұрыс» жүруге мәжбүрлемейтін өз бағытыңыз.','Planets, bases, and your own route without pressure to play the “right” way.','Des planètes, des bases et votre propre route sans pression de jouer « correctement ».'),url:'https://www.nomanssky.com/'},
    {id:'expedition33',title:'Clair Obscur: Expedition 33',icon:'🎨',traits:['story','tactician','competitor'],genre:tr('Сюжетная RPG','Оқиғалы RPG','Story RPG','RPG narratif'),desc:tr('Выразительный мир, важные персонажи и бои, где стратегия соединяется с точным исполнением.','Әсерлі әлем, маңызды кейіпкерлер және стратегия мен дәлдікті біріктіретін шайқастар.','A striking world, memorable characters, and combat that blends planning with precise execution.','Un univers marquant, des personnages forts et des combats mêlant stratégie et précision.'),url:'https://www.expedition33.com/'},
    {id:'it-takes-two',title:'It Takes Two',icon:'🧲',traits:['connector','explorer','story'],genre:tr('Кооперативное приключение','Кооперативтік шытырман','Co-op adventure','Aventure coopérative'),desc:tr('Почти каждая сцена даёт новую совместную механику. Игра хорошо показывает, нравится ли вам решать задачи буквально плечом к плечу.','Әр көрініс жаңа бірлескен механика береді. Тапсырманы бірге шешуді ұнататыныңызды жақсы көрсетеді.','Nearly every scene adds a new co-op mechanic—ideal if solving things side by side is the point.','Presque chaque scène ajoute une mécanique coopérative, idéale pour résoudre ensemble.'),url:'https://www.ea.com/games/it-takes-two/it-takes-two'},
    {id:'helldivers2',title:'Helldivers 2',icon:'🫡',traits:['connector','competitor','tactician'],genre:tr('Командный экшен','Командалық экшен','Squad action','Action en escouade'),desc:tr('Победа зависит от координации, а дружеский хаос сам создаёт истории. Для команды, которая умеет смеяться после провала.','Жеңіс үйлесімге байланысты, ал достық хаос өзі оқиға жасайды.','Victory depends on coordination, while friendly chaos creates its own stories.','La victoire dépend de la coordination, tandis que le chaos amical crée ses propres histoires.'),url:'https://www.playstation.com/games/helldivers-2/'},
    {id:'rocket-league',title:'Rocket League',icon:'⚽',traits:['competitor','connector'],genre:tr('Спортивный экшен','Спорттық экшен','Sports action','Action sportive'),desc:tr('Правила понятны за минуту, мастерство растёт месяцами. Особенно подходит тем, кому нужен быстрый командный вызов без длинного вступления.','Ережесі бір минутта түсінікті, шеберлігі айлар бойы өседі.','The rules take a minute; mastery takes months. Great for a fast team challenge without a long intro.','Les règles s’apprennent en une minute, la maîtrise en plusieurs mois.'),url:'https://www.rocketleague.com/'}
  ]

Object.assign(tests.lifeAnimal,{intro:tr('Кто живёт внутри вас: верный волк, находчивая лиса, надёжный медведь или общительный дельфин? Совпадения могут быть подозрительно точными.','Ішіңізде кім өмір сүреді: адал қасқыр, тапқыр түлкі, сенімді аю әлде көпшіл дельфин? Кейде өте дәл келуі мүмкін.','Who lives inside you: a loyal wolf, resourceful fox, dependable bear, or social dolphin? The match may be suspiciously accurate.','Qui vit en vous : loup fidèle, renard débrouillard, ours fiable ou dauphin sociable ? Le résultat peut être étonnamment juste.')});


const ONLINE=globalThis.PT_CONFIG.onlineRoot;const RESULT_UI={ru:{take:'Пройти этот тест',other:'Другие тесты',shared:'С вами поделились результатом'},kk:{take:'Осы тесттен өту',other:'Басқа тесттер',shared:'Сізбен нәтижені бөлісті'},en:{take:'Take this test',other:'Other tests',shared:'Someone shared this result with you'},fr:{take:'Faire ce test',other:'Autres tests',shared:'Ce résultat a été partagé avec vous'}};const enc=v=>btoa(unescape(encodeURIComponent(JSON.stringify(v)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');const dec=v=>{try{return JSON.parse(decodeURIComponent(escape(atob(v.replaceAll('-','+').replaceAll('_','/')))))}catch{return null}};const launch=new URLSearchParams(location.search),id=globalThis.PORTABLE_TEST_ID||launch.get('test')||'team';const test=tests[id]||tests.team;const browserLang=(navigator.language||'ru').toLowerCase().split('-')[0];let lang=localStorage.getItem('pt.lang')||(['ru','kk','en','fr'].includes(browserLang)?browserLang:'ru'),step=-1,answers=JSON.parse(localStorage.getItem(`pt.${id}.answers`)||'{}'),sharedResult=dec(location.hash.startsWith('#r=')?location.hash.slice(3):'');if(sharedResult?.test===id&&sharedResult.scores){lang=sharedResult.lang||lang;step=test.questions.length}else{sharedResult=null;const complete=test.questions.every((_,index)=>answers[index]!==undefined);if(launch.get('retake')==='1'){answers={};localStorage.removeItem(`pt.${id}.answers`);step=0;history.replaceState(null,'',`${location.pathname}?test=${id}`)}else if(launch.get('view')==='result'&&complete)step=test.questions.length}const app=document.querySelector('#app');
const UI={ru:{private:'100% приватно · ответы остаются здесь',start:'Показать мой результат',questions:'вопросов',minutes:'≈ 2–4 минуты',back:'Назад',next:'Далее',result:'Твой результат',lead:'Это не один ярлык: ведущие способы могут отлично работать вместе.',share:'Поделиться результатом',again:'Пройти заново',copy:'Скопировать ссылку',copied:'Скопировано',home:'Все тесты',fun:'РАЗВЛЕКАТЕЛЬНЫЙ ТЕСТ',note:'Результат предназначен для саморефлексии и не является психологической диагностикой.',funNote:'Это шуточный результат — никаких диагнозов, только хорошее настроение.',details:'Показать проценты',hideDetails:'Скрыть проценты',resultLabel:'ТВОЙ МЕМНЫЙ ТИП',youAre:'Вы —',also:'А ещё в тебе есть',answers:['Совсем не про меня','Скорее не про меня','Не уверен(а)','Скорее про меня','Очень похоже на меня']},kk:{private:'100% құпия · жауаптар осында қалады',start:'Нәтижемді көрсету',questions:'сұрақ',minutes:'≈ 2–4 минут',back:'Артқа',next:'Келесі',result:'Сенің нәтижең',lead:'Бұл бір ғана атау емес: жетекші тәсілдер бірге жақсы жұмыс істей алады.',share:'Нәтижемен бөлісу',again:'Қайта өту',copy:'Сілтемені көшіру',copied:'Көшірілді',home:'Барлық тест',fun:'ОЙЫН-САУЫҚ ТЕСТІ',note:'Нәтиже өзін тануға арналған және психологиялық диагностика емес.',funNote:'Бұл әзіл нәтиже — диагноз жоқ, тек жақсы көңіл күй.',details:'Пайыздарды көрсету',hideDetails:'Пайыздарды жасыру',resultLabel:'СІЗДІҢ МЕМ БЕЙНЕҢІЗ',youAre:'Сіз —',also:'Сізде тағы бар',answers:['Мүлде маған ұқсамайды','Көбіне ұқсамайды','Нақты білмеймін','Көбіне ұқсайды','Өте ұқсайды']},en:{private:'100% private · answers stay here',start:'Show my result',questions:'questions',minutes:'≈ 2–4 minutes',back:'Back',next:'Next',result:'Your result',lead:'This is not one fixed label: leading styles can work well together.',share:'Share result',again:'Start again',copy:'Copy link',copied:'Copied',home:'All tests',fun:'ENTERTAINMENT QUIZ',note:'This result is for self-reflection and is not a psychological assessment.',funNote:'A playful result—no diagnosis, just fun.',details:'Show percentages',hideDetails:'Hide percentages',resultLabel:'YOUR MEME TYPE',youAre:'You are',also:'You also have some',answers:['Not like me at all','Mostly not like me','Not sure','Mostly like me','Very much like me']},fr:{private:'100 % privé · réponses sur cet appareil',start:'Voir mon résultat',questions:'questions',minutes:'≈ 2–4 minutes',back:'Retour',next:'Suivant',result:'Votre résultat',lead:'Ce n’est pas une étiquette fixe : plusieurs styles peuvent bien fonctionner ensemble.',share:'Partager le résultat',again:'Recommencer',copy:'Copier le lien',copied:'Copié',home:'Tous les tests',fun:'TEST DIVERTISSANT',note:'Ce résultat sert à la réflexion personnelle et ne constitue pas une évaluation psychologique.',funNote:'Un résultat ludique : aucun diagnostic, juste du plaisir.',details:'Voir les pourcentages',hideDetails:'Masquer les pourcentages',resultLabel:'VOTRE PROFIL MÈME',youAre:'Vous êtes',also:'Vous avez aussi un peu de',answers:['Pas du tout moi','Plutôt pas moi','Je ne sais pas','Plutôt moi','Tout à fait moi']}};const u=()=>UI[lang],x=o=>o[lang]||o.ru;
function shell(body){app.innerHTML=`<header class="top"><a class="brand" href="https://zhanat-arch.github.io/Portable-Tests/"><span class="mark">P</span><span>Portable Tests</span></a><div class="tools"><select id="lang"><option>RU</option><option>KK</option><option>EN</option><option>FR</option></select></div></header>${body}`;document.querySelector('#lang').value=lang.toUpperCase();document.querySelector('#lang').onchange=e=>{lang=e.target.value.toLowerCase();localStorage.setItem('pt.lang',lang);render()}}
function intro(){const art=test.image?`<img class="hero-image" src="${test.image}" alt="">`:`<div class="hero-image" style="background:radial-gradient(circle at 25% 20%,#ffda70,transparent 25%),linear-gradient(135deg,#4132a5,#cc4f8d);display:grid;place-items:center;font-size:96px">${test.icon}</div>`;shell(`<main class="card"><div class="intro-art">${art}<span class="hero-shade"></span><span class="hero-badge">${x(test.hook)}</span></div><h1>${x(test.title)}</h1><p class="lead">${x(test.intro)}</p><div class="meta"><span class="pill">${test.questions.length} ${u().questions}</span><span class="pill">${u().minutes}</span><span class="pill">${Object.keys(test.scales).length} ✦</span></div><div class="privacy">🔒 ${u().private}</div><button class="primary" id="start">${u().start} →</button></main>`);document.querySelector('#start').onclick=()=>{step=0;render()}}
function quiz(){const q=test.questions[step],v=answers[step],pct=Math.round(step/test.questions.length*100);shell(`<main class="card"><div class="progress-line"><span>${step+1} / ${test.questions.length}</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div><div class="scene"><div class="scene-icon">${test.icon}</div></div><h2 class="question">${x(q.text)}</h2><div class="answers">${u().answers.map((a,i)=>`<button class="answer ${v===i?'selected':''}" data-v="${i}"><b>${i+1}</b><span>${a}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="prev">← ${u().back}</button><button class="primary" id="next" ${v===undefined?'disabled':''}>${u().next} →</button></div></main>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.v;localStorage.setItem(`pt.${id}.answers`,JSON.stringify(answers));quiz()});document.querySelector('#prev').onclick=()=>{step=Math.max(-1,step-1);render()};document.querySelector('#next').onclick=()=>{step++;render()}}
function scores(){if(sharedResult)return Object.entries(sharedResult.scores).filter(([key])=>test.scales[key]).map(([key,value])=>({key,value})).sort((a,b)=>b.value-a.value);const s=Object.fromEntries(Object.keys(test.scales).map(k=>[k,{sum:0,max:0}]));test.questions.forEach((q,i)=>{s[q.scale].sum+=(answers[i]??0);s[q.scale].max+=4});return Object.entries(s).map(([key,v])=>({key,value:Math.round(v.sum/v.max*100)})).sort((a,b)=>b.value-a.value)}
function scoreBars(s){return `<div class="scores">${s.map((v,i)=>`<div class="score"><strong>${i<2?'✦':'·'} ${x(test.scales[v.key])}</strong><b>${v.value}%</b><div class="bar"><i style="width:${v.value}%;background:${['#5a50df','#d85f94','#25a48f','#e09a3e','#4387d8','#7954c7'][i]}"></i></div></div>`).join('')}</div>`}
function gamingResult(s,top){const profile=funProfiles.gamer[top[0].key],ui=gameGuide.ui[lang],scoreMap=Object.fromEntries(s.map(v=>[v.key,v.value])),picked=gameGuide.games.map(game=>({...game,match:Math.round(game.traits.reduce((sum,key)=>sum+(scoreMap[key]||45),0)/game.traits.length)})).sort((a,b)=>b.match-a.match).slice(0,6),played=JSON.parse(localStorage.getItem('pt.gamer.played')||'{}'),genres=s.slice(0,3).map(v=>`<span>${x(gameGuide.genres[v.key])}</span>`).join('');return `<section class="gamer-result"><div class="gamer-avatar">${profile.emoji}</div><div class="eyebrow">${x(test.title)}</div><h1>${x(test.scales[top[0].key])}</h1><p class="gamer-lead">${x(profile.desc)}</p><div class="genre-block"><h2>${ui.genres}</h2><div class="genre-pills">${genres}</div></div><section class="game-guide"><h2>${ui.title}</h2><p>${ui.intro}</p><div class="game-list">${picked.map((game,index)=>`<details class="game-card"><summary><span class="game-icon">${game.icon}</span><span><b>${game.title}</b><small>${x(game.genre)}</small></span><strong>${game.match}%</strong></summary><div class="game-detail"><h3>${ui.why}</h3><p>${x(game.desc)}</p><label><input type="checkbox" data-played="${game.id}" ${played[game.id]?'checked':''}> ${ui.known}</label><a href="${game.url}" target="_blank" rel="noopener">${ui.official} ↗</a></div></details>`).join('')}</div><div class="game-privacy">🔒 ${ui.privacy}</div></section></section><details class="score-details"><summary>${u().details}</summary>${scoreBars(s)}</details>`}
function result(){const s=scores(),top=s.slice(0,2),profile=funProfiles?.[id]?.[top[0].key],resultUrl=`${ONLINE}tests/quick/index.html?v=193&test=${id}#r=${enc({v:1,test:id,lang,scores:Object.fromEntries(s.map(x=>[x.key,x.value]))})}`,text=test.fun?`${x(test.title)}: ${profile?.emoji||test.icon} ${x(test.scales[top[0].key])}`: `${x(test.title)}: ${top.map(v=>`${x(test.scales[v.key])} ${v.value}%`).join(', ')}`;const body=id==='gamer'?gamingResult(s,top):test.fun?`<section class="meme-result">${profile?.image?`<img class="meme-photo" src="${profile.image}" alt="${x(test.scales[top[0].key])}">`:`<div class="meme-emoji">${profile?.emoji||test.icon}</div>`}<div class="eyebrow">${u().resultLabel}</div><h1>${u().youAre} ${x(test.scales[top[0].key])}</h1><p>${profile?x(profile.desc):u().funNote}</p><div class="meme-side">✦ ${u().also}: <b>${x(test.scales[top[1].key])}</b></div></section><details class="score-details"><summary>${u().details}</summary>${scoreBars(s)}</details>`: `<section class="result-head"><div class="eyebrow">${sharedResult?RESULT_UI[lang].shared:'Portable Tests'}</div><div class="result-symbols">${test.icon} ✦</div><h1>${u().result}</h1><p class="summary">${u().lead}</p></section>${scoreBars(s)}<div class="mini"><h3>${top.map(v=>x(test.scales[v.key])).join(' + ')}</h3><p>${u().note}</p></div>`;shell(`<main class="card">${sharedResult&&test.fun?`<div class="shared-note">${RESULT_UI[lang].shared}</div>`:''}${body}<div class="footer-actions"><button class="primary" id="share">${u().share}</button><button class="secondary" id="copy">${u().copy}</button><button class="secondary" id="again">${RESULT_UI[lang].take}</button><a class="btn ghost" href="https://zhanat-arch.github.io/Portable-Tests/">${RESULT_UI[lang].other}</a></div></main>`);if(id==='gamer')document.querySelectorAll('[data-played]').forEach(box=>box.onchange=()=>{const played=JSON.parse(localStorage.getItem('pt.gamer.played')||'{}');played[box.dataset.played]=box.checked;localStorage.setItem('pt.gamer.played',JSON.stringify(played))});document.querySelector('#share').onclick=()=>navigator.share?navigator.share({title:x(test.title),text,url:resultUrl}):copy(`${text}\n${resultUrl}`);document.querySelector('#copy').onclick=()=>copy(`${text}\n${resultUrl}`);document.querySelector('#again').onclick=()=>{history.replaceState(null,'',`${location.pathname}?test=${id}`);sharedResult=null;answers={};localStorage.removeItem(`pt.${id}.answers`);step=0;render()}}
async function copy(v){await navigator.clipboard.writeText(v);const e=document.querySelector('#toast');e.textContent=u().copied;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function render(){document.documentElement.lang=lang;document.title=`${x(test.title)} · Portable Tests`;const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=x(test.intro);if(step<0)intro();else if(step<test.questions.length)quiz();else result()}render();
</script></body></html>
