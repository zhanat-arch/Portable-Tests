team:{icon:'🤝',image:'../../hero-team.png',fun:false,title:tr('Кто ты в команде?','Командада сен кімсің?','Who are you on a team?','Quel rôle jouez-vous en équipe ?'),hook:tr('12 ситуаций · 6 способов быть незаменимым','12 жағдай · пайдалы болудың 6 жолы','12 situations · 6 ways to contribute','12 situations · 6 façons de contribuer'),intro:tr('Узнайте, какой вклад вы естественно привносите в общее дело. Здесь нет главных и второстепенных ролей.','Ортақ іске табиғи түрде қандай үлес қосатыныңызды біліңіз. Мұнда маңызды емес рөл жоқ.','Discover the contribution you naturally bring to shared work. No role is more important than another.','Découvrez la contribution que vous apportez naturellement. Aucun rôle n’est supérieur.'),scales:{ideas:tr('Генератор идей','Идея генераторы','Idea generator','Générateur d’idées'),strategy:tr('Стратег','Стратег','Strategist','Stratège'),connector:tr('Связующий','Байланыстырушы','Connector','Médiateur'),coordinator:tr('Координатор','Үйлестіруші','Coordinator','Coordinateur'),builder:tr('Реализатор','Іске асырушы','Builder','Réalisateur'),quality:tr('Хранитель качества','Сапа сақшысы','Quality guardian','Garant qualité')},questions:[

tice an inner feeling of ease or tension','Je remarque mon sentiment intérieur de calme ou tension','intuitive'),q('Перед решением мне полезно услышать разные точки зрения','Шешім алдында әртүрлі пікір естіген пайдалы','Before deciding, I benefit from hearing different views','Avant de décider, j’écoute plusieurs points de vue','collab'),q('Я проверяю идею разговором с человеком, которому доверяю','Идеяны сенетін адаммен сөйлесіп тексеремін','I test an idea by discussing it with someone I trust','Je teste une idée avec une personne de confiance','collab'),q('Если риск невелик, я предпочитаю быстро попробовать','Тәуекел аз болса, тез байқап көремін','If risk is low, I prefer to try quickly','Si le risque est faible, je préfère essayer vite','rapid'),q('Маленький эксперимент для меня полезнее долгих догадок','Кішкентай тәжірибе ұзақ жорамалдан пайдалы','A small experiment is more useful than long guessing','Une petite expérience vaut mieux que de longues suppositions','rapid'),q('Мне нужно немного времени, чтобы решение созрело','Шешімнің пісуі үшін маған уақыт керек','I need some time for a decision to mature','J’ai besoin de temps pour laisser mûrir une décision','reflective'),q('После паузы я часто замечаю то, что сначала упустил','Үзілістен кейін алғаш байқамағанымды көремін','After a pause, I often notice what I first missed','Après une pause, je remarque ce qui m’avait échappé','reflective')]},
environment:{icon:'🌿',image:'../../hero-environment.png',fun:false,title:tr('Какая среда раскрывает тебя?','Қандай орта сені ашады?','Which environment brings out your best?','Quel environnement révèle votre potentiel ?'),hook:tr('12 ситуаций · 6 условий для роста','12 жағдай · өсуге арналған 6 шарт','12 situations · 6 conditions for growth','12 situations · 6 conditions pour grandir'),intro:tr('Определите условия, в которых вам легче сохранять интерес и показывать сильные стороны.','Қызығушылықты сақтап, күшті жағыңызды көрсетуге ыңғайлы шарттарды анықтаңыз.','Identify the conditions that help you stay engaged and show your strengths.','Identifiez les conditions qui vous aident à rester engagé et à montrer vos forces.'),scales:{focus:tr('Тихий фокус','Тыныш зейін','Quiet focus','Concentration calme'),social:tr('Живое сотрудничество','Жанды ынтымақтастық','Active collaboration','Collaboration active'),freedom:tr('Свобода выбора','Таңдау еркіндігі','Freedom to choose','Liberté de choisir'),structure:tr('Ясная структура','Айқын құрылым','Clear structure','Structure claire'),hands:tr('Практика и движение','Практика және қимыл','Hands-on action','Action concrète'),pace:tr('Быстрый ритм','Жылдам ырғақ','Fast pace','Rythme rapide')},questions:[q('Я лучше думаю, когда меня долго не отвлекают','Мені ұзақ уақыт бөлмегенде жақсы ойланамын','I think best when I am not interrupted','Je réfléchis mieux sans interruptions','focus'),q('Мне нужен уголок, где можно спокойно углубиться в задачу','Тапсырмаға тыныш тереңдейтін орын керек','I need a place to quietly go deep into a task','J’ai besoin d’un lieu calme pour approfondir','focus'),q('Обсуждение с другими часто даёт мне энергию','Басқалармен талқылау маған қуат береді','Discussion with others often energizes me','Discuter avec les autres me donne de l’énergie','social'),q('Мне нравится регулярно обмениваться идеями в процессе','Жұмыс барысында ой алмасқанды ұнатамын','I like exchanging ideas throughout the process','J’aime échanger des idées pendant le travail','social'),q('Я работаю лучше, когда могу сам выбрать способ','Тәсілді өзім таңдағанда жақсы жұмыс істеймін','I work better when I can choose my own method','Je travaille mieux quand je choisis ma méthode','freedom'),q('Возможность экспериментировать поддерживает мой интерес','Тәжірибе жасау мүмкіндігі қызығушылығымды сақтайды','The freedom to experiment keeps me interested','La liberté d’expérimenter maintient mon intérêt','freedom'),q('Понятные этапы и критерии помогают мне начать','Айқын кезеңдер мен өлшемдер бастауға көмектеседі','Clear stages and criteria help me begin','Des étapes claires m’aident à commencer','structure'),q('Мне спокойнее, когда роли и сроки определены','Рөлдер мен мерзім анық болса, өзімді тыныш сезінемін','I feel calmer when roles and deadlines are clear','Je suis plus serein quand rôles et délais sont clairs','structure'),q('Мне важно двигаться и что-то делать руками','Қозғалып, қолмен бірдеңе жасау маңызды','I need movement and hands-on activity','J’ai besoin de mouvement et d’activité concrète','hands'),q('Видимый результат заряжает меня сильнее отчёта','Көрінетін нәтиже есептен көбірек қуат береді','A visible result motivates me more than a report','Un résultat visible me motive plus qu’un rapport','hands'),q('Короткие интенсивные задачи включают меня','Қысқа қарқынды тапсырмалар мені жұмылдырады','Short intense tasks switch me on','Les tâches courtes et intenses me stimulent','pace'),q('Я не теряюсь, когда планы быстро меняются','Жоспар тез өзгергенде абдырамаймын','I stay effective when plans change quickly','Je reste efficace quand les plans changent vite','pace')]},
battery:{icon:'🔋',fun:true,title:tr('Какой у тебя режим батарейки?','Батареяңның режимі қандай?','What is your battery mode?','Quel est votre mode batterie ?'),hook:tr('8 вопросов · серьёзность 0%','8 сұрақ · байсалдылық 0%','8 questions · 0% seriousness','8 questions · 0 % de sérieux'),intro:tr('Научно не доказано, зато подозрительно похоже. Развлекательный тест.','Ғылыми дәлелденбеген, бірақ ұқсап кетуі мүмкін. Ойын-сауық тесті.','Not scientifically proven, yet suspiciously relatable. Entertainment only.','Pas scientifique, mais étrangement ressemblant. Divertissement uniquement.'),scales:{turbo:tr('Турборежим','Турборежим','Turbo mode','Mode turbo'),balance:tr('Умный баланс','Ақылды баланс','Smart balance','Équilibre malin'),saving:tr('Энергосбережение','Қуат үнемдеу','Power saver','Économie d’énergie'),night:tr('Ночной режим','Түнгі режим','Night mode','Mode nuit')},questions:[q('Новая идея? Уже открыл три приложения и создал проект','Жаңа идея ма? Үш қолданба ашып, жоба құрдым','New idea? I already opened three apps and made a project','Nouvelle idée ? J’ai déjà ouvert trois applis et créé le projet','turbo'),q('Дедлайн включает во мне дополнительный реактор','Дедлайн қосымша реакторымды іске қосады','A deadline activates my extra reactor','Une échéance active mon réacteur bonus','turbo'),q('Я умею чередовать рывок, паузу и нормальный сон','Қарқын, үзіліс және ұйқыны кезектестіре аламын','I can alternate sprints, breaks, and real sleep','J’alterne sprint, pause et vrai sommeil','balance'),q('Мой календарь иногда даже знает правду','Күнтізбем кейде шындықты да біледі','My calendar occasionally knows the truth','Mon calendrier connaît parfois la vérité','balance'),q('После двух встреч мне нужен режим «не трогать»','Екі кездесуден кейін «мазалама» режимі керек','After two meetings I need do-not-disturb mode','Après deux réunions, il me faut le mode silencieux','saving'),q('Я берегу силы для действительно важных задач','Күшімді шын маңызды істерге сақтаймын','I save energy for what truly matters','Je garde mon énergie pour ce qui compte','saving'),q('Лучшие мысли приходят, когда нормальные люди уже спят','Жақсы ойлар басқалар ұйықтағанда келеді','My best ideas arrive when normal people are asleep','Mes meilleures idées arrivent quand tout le monde dort','night'),q('В 23:47 внезапно идеально начать новую жизнь','23:47-де жаңа өмір бастау өте орынды','At 23:47 it suddenly feels perfect to restart life','À 23 h 47, recommencer sa vie semble parfait','night')]},
tabs:{icon:'🧠',fun:true,title:tr('Кто управляет твоими 47 вкладками?','47 бетіңді кім басқарады?','Who runs your 47 tabs?','Qui dirige vos 47 onglets ?'),hook:tr('8 вопросов · цифровая археология','8 сұрақ · цифрлық археология','8 questions · digital archaeology','8 questions · archéologie numérique'),intro:tr('Разберём хаос, не закрывая ничего важного. Развлекательный тест.','Маңыздысын жаппай-ақ, ретсіздікті зерттейік. Ойын-сауық тесті.','Let’s inspect the chaos without closing anything important. Entertainment only.','Explorons le chaos sans rien fermer d’important. Divertissement uniquement.'),scales:{explorer:tr('Исследователь','Зерттеуші','Explorer','Explorateur'),collector:tr('Коллекционер идей','Идея жинаушы','Idea collector','Collectionneur d’idées'),deadline:tr('Укротитель дедлайна','Дедлайн бағындырушы','Deadline tamer','Dominateur des délais'),minimal:tr('Цифровой минималист','Цифрлық минималист','Digital minimalist','Minimaliste numérique')},questions:[q('Одна статья ведёт к пяти новым вопросам — всё по плану','Бір мақала бес жаңа сұраққа әкеледі — жоспар бойынша','One article leads to five new questions—as planned','Un article mène à cinq questions : tout va bien','explorer'),q('Я открываю вкладку, чтобы понять тему когда-нибудь полностью','Тақырыпты бір күні толық түсіну үшін бетті ашамын','I open a tab to understand the topic fully someday','J’ouvre un onglet pour tout comprendre un jour','explorer'),q('Закладка — это обещание будущему себе','Бетбелгі — болашақтағы өзіме уәде','A bookmark is a promise to my future self','Un favori est une promesse à mon futur moi','collector'),q('У меня есть папка «полезное», внутри ещё семь папок','Менде «пайдалы» деген бума бар, ішінде тағы жеті бума','I have a “useful” folder containing seven more folders','J’ai un dossier « utile » avec sept sous-dossiers','collector'),q('За час до срока вкладки внезапно строятся в боевой порядок','Мерзімге бір сағат қалғанда беттер сапқа тұрады','An hour before deadline, tabs form battle order','Une heure avant l’échéance, les onglets se mettent au garde-à-vous','deadline'),q('Мой хаос становится системой, когда уже очень надо','Өте қажет кезде ретсіздігім жүйеге айналады','My chaos becomes a system when it absolutely must','Mon chaos devient un système quand il le faut vraiment','deadline'),q('Если вкладка не нужна сейчас, я закрываю её без церемоний','Бет қазір керек болмаса, бірден жабамын','If a tab is not useful now, I close it without ceremony','Si un onglet ne sert pas maintenant, je le ferme','minimal'),q('Чистый браузер дарит мне внутренний покой','Таза браузер маған ішкі тыныштық береді','A clean browser gives me inner peace','Un navigateur propre m’apporte la paix intérieure','minimal')]},
animal:{icon:'🐾',fun:true,title:tr('Какое ты животное в интернете?','Интернетте сен қай жануарсың?','Which internet animal are you?','Quel animal d’Internet es-tu ?'),hook:tr('8 вопросов · мемометр включён','8 сұрақ · мем өлшегіш қосылды','8 questions · meme meter on','8 questions · détecteur de mèmes activé'),intro:tr('Выясним, кто сидит по ту сторону экрана. Спойлер: человек там не всегда. Развлекательный тест.','Экранның ар жағында кім отырғанын білейік. Спойлер: ол әрдайым адам емес. Ойын-сауық тесті.','Let’s find out who is really behind the screen. Spoiler: not always a human. Entertainment only.','Découvrons qui est vraiment derrière l’écran. Spoiler : pas toujours un humain. Pour rire.'),scales:{cat:tr('Кот-эксперт','Сарапшы мысық','Expert cat','Chat expert'),capybara:tr('Капибара-дипломат','Капибара-дипломат','Capybara diplomat','Capybara diplomate'),raccoon:tr('Енот-исследователь','Зерттеуші жанат','Raccoon explorer','Raton laveur explorateur'),owl:tr('Сова-наблюдатель','Бақылаушы үкі','Observer owl','Hibou observateur')},questions:[q('Сначала посмотрю со стороны. Потом решу, достойно ли это моего внимания','Алдымен сырттан қараймын. Сосын назар аударуға тұра ма, шешемін','I watch first, then decide if this deserves my attention','J’observe d’abord, puis je décide si cela mérite mon attention','cat'),q('Если я лёг удобно, планы официально отменяются','Ыңғайланып жатсам, жоспар ресми түрде тоқтайды','If I get comfortable, all plans are officially canceled','Si je suis bien installé, tous les projets sont annulés','cat'),q('В споре я предпочитаю чай, мир и чтобы все немного успокоились','Дауда шайды, тыныштықты және бәрінің сабырға келгенін қалаймын','In an argument, I prefer tea, peace, and everyone calming down','En cas de dispute, je choisis le thé, la paix et le calme','capybara'),q('Я могу подружиться даже с человеком, который пишет голосовые на восемь минут','Сегіз минуттық дауыстық хабарлама жіберетін адаммен де дос бола аламын','I can befriend even someone who sends eight-minute voice notes','Je peux même devenir ami avec quelqu’un qui envoie huit minutes de vocal','capybara'),q('Что в этой кнопке? Узнаем только одним способом','Бұл батырма не істейді? Бір-ақ жолмен білеміз','What does this button do? There is only one way to find out','Que fait ce bouton ? Il n’y a qu’une façon de le savoir','raccoon'),q('Мне не нужен этот странный файл. Поэтому я уже его скачал','Бұл қызық файл маған керек емес. Сол себепті жүктеп қойдым','I do not need this strange file. That is why I already downloaded it','Je n’ai pas besoin de ce fichier étrange. Voilà pourquoi je l’ai téléchargé','raccoon'),q('Пока все шумят, я уже понял, что происходит','Бәрі шулап жатқанда, не болып жатқанын түсініп қойдым','While everyone is loud, I already understand what is happening','Pendant que tout le monde parle, j’ai déjà compris','owl'),q('Моя активность начинается примерно тогда, когда другие пишут «спокойной ночи»','Басқалар «қайырлы түн» дегенде менің белсенділігім басталады','My activity begins when others say good night','Je deviens actif quand les autres disent bonne nuit','owl')]},lifeAnimal:{icon:'🌍',fun:true,title:tr('Какое вы животное по жизни?','Өмірде сіз қай жануарсыз?','Which animal are you in life?','Quel animal êtes-vous dans la vie ?'),hook:tr('16 жизненных ситуаций · 4 характера','16 өмірлік жағдай · 4 мінез','16 life situations · 4 personalities','16 situations de vie · 4 caractères'),intro:tr('Кто живёт внутри вас: верный волк, находчивая лиса, надёжный медведь или общительный дельфин? Развлекательный тест, но совпадения могут быть подозрительно точными.','Ішіңізде кім өмір сүреді: адал қасқыр, тапқыр түлкі, сенімді аю немесе көпшіл дельфин? Бұл әзіл тест, бірақ кейде өте дәл келеді.','Who lives inside you: a loyal wolf, resourceful fox, dependable bear, or social dolphin? Just for fun, but sometimes suspiciously accurate.','Qui vit en vous : loup fidèle, renard débrouillard, ours fiable ou dauphin sociable ? Pour rire, mais parfois étonnamment juste.'),scales:{wolf:tr('Волк — свой человек','Қасқыр — сенімді серік','Wolf — loyal ally','Loup — allié fidèle'),fox:tr('Лиса — мастер хода','Түлкі — амал шебері','Fox — master improviser','Renard — maître de l’improvisation'),bear:tr('Медведь — надёжный тыл','Аю — сенімді тірек','Bear — The Solid Anchor','Ours — pilier solide'),dolphin:tr('Дельфин — душа компании','Дельфин — ортаның сәні','Dolphin — life of the party','Dauphin — âme de la fête')},questions:[q("Если близкому человеку нужна помощь, я подключаюсь без долгих разговоров","Жақын адамға көмек керек болса, көп сөзсіз көмектесемін","When someone close needs help, I step in without a long discussion","Quand un proche a besoin d’aide, j’interviens sans longs discours","wolf"),q("Мне важно чувствовать, что рядом есть свои люди","Жанымда өз адамдарым барын сезіну маңызды","It matters to me to have my people nearby","Il est important pour moi d’avoir mes proches à mes côtés","wolf"),q("В общей поездке я незаметно слежу, чтобы никто не потерялся","Ортақ сапарда ешкім жоғалмасын деп байқатпай қадағалаймын","On a group trip, I quietly make sure nobody gets lost","En voyage de groupe, je vérifie discrètement que personne ne se perde","wolf"),q("Если наступают трудные времена, я собираюсь и держу удар","Қиын кезеңде өзімді жинап, төтеп беремін","When times get hard, I pull myself together and hold steady","Quand les temps sont durs, je me rassemble et je tiens bon","wolf"),q("Когда план ломается, я быстро придумываю другой путь","Жоспар бұзылса, басқа жолды тез табамын","When a plan breaks, I quickly find another route","Quand un plan échoue, je trouve vite une autre voie","fox"),q("Я умею подобрать правильные слова для разных людей","Әртүрлі адамға дұрыс сөз таба аламын","I can find the right words for different people","Je sais trouver les bons mots selon la personne","fox"),q("В незнакомой ситуации сначала ищу возможности, а не проблемы","Бейтаныс жағдайда алдымен қиындықты емес, мүмкіндік const funProfiles={battery:{turbo:{emoji:'🚀',desc:tr('Ты включаешься раньше, чем загрузился план. Твоя суперсила — запускать движение.','Жоспар жүктелмей жатып іске кірісесің. Күшің — қозғалыс бастау.','You start before the plan finishes loading. Your power is creating momentum.','Tu démarres avant même que le plan soit chargé. Ton pouvoir : lancer le mouvement.')},balance:{emoji:'⚖️',desc:tr('Ты умеешь и разогнаться, и вовремя найти зарядку. Редкий взрослый навык.','Қарқын алып, уақытында қуат жинай аласың. Сирек кездесетін қабілет.','You can sprint and still find the charger in time. A rare grown-up skill.','Tu sais accélérer et trouver le chargeur à temps. Un talent rare.')},saving:{emoji:'🌱',desc:tr('Ты не ленишься — ты грамотно распределяешь ресурс. Не трогать до появления важной миссии.','Сен жалқау емессің — күшіңді дұрыс бөлесің. Маңызды миссияға дейін мазаламау керек.','You are not lazy—you allocate resources wisely. Do not disturb until the mission matters.','Tu n’es pas paresseux : tu gères tes ressources. À réveiller pour une vraie mission.')},night:{emoji:'🌙',desc:tr('Днём система обновляется, ночью открывается портал идей. Главное — иногда всё-таки спать.','Күндіз жүйе жаңарады, түнде идеялар порталы ашылады. Кейде ұйықтауды ұмытпа.','The system updates by day; the idea portal opens at night. Remember to sleep sometimes.','Le système se met à jour le jour, le portail des idées s’ouvre la nuit. Pense à dormir.')}},tabs:{explorer:{emoji:'🧭',desc:tr('Каждая вкладка — новая экспедиция. Вернуться домой можно, но зачем?','Әр бет — жаңа сапар. Үйге қайтуға болады, бірақ не үшін?','Every tab is a new expedition. You could go home, but why?','Chaque onglet est une expédition. Tu pourrais rentrer, mais pourquoi ?')},collector:{emoji:'🗃️',desc:tr('Ты не копишь вкладки — ты создаёшь музей будущих великих идей.','Сен беттерді жинамайсың — болашақ ұлы идеялардың мұражайын жасайсың.','You do not hoard tabs; you curate a museum of future great ideas.','Tu n’accumules pas les onglets : tu crées un musée des futures grandes idées.')},deadline:{emoji:'🔥',desc:tr('До дедлайна хаос отдыхает. Потом ты собираешь из него работающий космолёт.','Дедлайнға дейін ретсіздік демалады. Кейін одан ғарыш кемесін құрастырасың.','Chaos rests until the deadline. Then you build a working spaceship from it.','Le chaos se repose jusqu’à l’échéance. Puis tu en fais un vaisseau spatial.')},minimal:{emoji:'✨',desc:tr('Три вкладки. Чистый рабочий стол. Остальные смотрят на тебя с уважением и страхом.','Үш бет. Таза жұмыс үстелі. Басқалар саған құрметпен әрі қорқынышпен қарайды.','Three tabs. Clean desktop. Everyone else looks at you with respect and fear.','Trois onglets. Bureau propre. Les autres te regardent avec respect et peur.')}},animal:{cat:{emoji:'🐈',image:'../../meme-animal-cat.png',desc:tr('Сначала вы смотрите. Потом оцениваете. И только после этого позволяете интернету вас развлечь. Ваш талант — выглядеть экспертом даже тогда, когда вы просто случайно сели рядом с ноутбуком.','Сен бақылап, бағалап, қызық болғанда ғана келесің. Еркіндік — сенің белгің.','You observe, judge, and appear exactly when things get interesting. Independence is your brand.','Tu observes, tu juges et tu arrives quand cela devient intéressant. L’indépendance est ta marque.')},capybara:{emoji:'🫶',image:'../../meme-animal-capybara.png',desc:tr('Пока остальные спорят в комментариях, вы уже поставили чайник и помирили обе стороны. Ваше тайное оружие — спокойный взгляд человека, который знает: через пять минут всем всё равно надоест.','Сенің жаныңда интернет дауы да бір сәтке тынышталады.','Around you, even an internet argument briefly remembers peace is possible.','Près de toi, même une dispute en ligne se rappelle que la paix existe.')},raccoon:{emoji:'🦝',image:'../../meme-animal-raccoon.png',desc:tr('Если на кнопке написано «не нажимать», вы уже нажали два раза и сделали скриншот. Ваш браузер знает слишком много, зато именно вы находите то самое видео, которое потом смотрят все.','Қызығушылық сені басқалар баспайтын жерге апарады. Бірақ олжасыз қайтпайсың.','Curiosity takes you where normal people do not click. You always return with treasure.','La curiosité t’emmène là où personne ne clique. Tu reviens toujours avec un trésor.')},owl:{emoji:'🦉',image:'../../meme-animal-owl.png',desc:tr('Днём вы тихо наблюдаете, ночью открываете ноутбук и внезапно понимаете устройство Вселенной. В общий чат заходите редко, зато одной фразой закрываете спор на сорок сообщений.','Көп көріп, аз сөйлейсің де, бәрін түсіндіретін бір ауыз сөз айтасың.','You see more, say less, then drop one sentence that explains everything.','Tu vois plus, tu parles moins, puis tu dis la phrase qui explique tout.')}},lifeAnimal:{wolf:{emoji:'🐺',image:'../../meme-life-wolf.png',desc:tr('Вы из тех, кто сначала проверит, все ли добрались домой, и только потом вспомнит о себе. Своих не бросаете, хаос собираете в стаю, а фразу «разберёмся» произносите так, что действительно становится спокойнее.','Алдымен бәрі үйіне жетті ме деп тексеріп, кейін өзіңізді ойлайсыз. Жақындарыңызды тастамайсыз, ретсіздікті топқа айналдырасыз.','You make sure everyone gets home before remembering yourself. You never abandon your people and can turn chaos into a pack with one calm “we’ll handle it.”','Vous vérifiez que tout le monde est rentré avant de penser à vous. Vous ne laissez personne derrière et transformez le chaos en meute.')},fox:{emoji:'🦊',image:'../../meme-life-fox.png',desc:tr('План А исчез? Отлично, у вас уже есть план Б, красивое объяснение и запасной выход. Вы не хитрите — вы творчески договариваетесь с реальностью. Иногда реальность даже не замечает, как согласилась.','А жоспары жоғалды ма? Сізде Б жоспары, әдемі түсініктеме және қосымша жол дайын. Сіз шындықпен шығармашылықпен келісесіз.','Plan A vanished? Great—you already have plan B, a convincing explanation, and a side exit. You do not cheat; you negotiate creatively with reality.','Le plan A a disparu ? Parfait : vous avez déjà un plan B, une belle explication et une sortie de secours.')},bear:{emoji:'🐻',image:'../../meme-life-bear.png',desc:tr('Вы выглядите спокойно, пока кто-нибудь не тронул ваших людей, ваш сон или последний кусок вкусного. На вас можно опереться, у вас можно согреться, но важные переговоры лучше начинать после обеда.','Біреу жақындарыңызға, ұйқыңызға немесе соңғы дәмді тағамға тимесе, сабырлысыз. Сізге сенуге болады, бірақ маңызды әңгімені түстен кейін бастаған дұрыс.','You are calm until someone touches your people, your sleep, or the last snack. You are dependable and warm—but serious negotiations should begin after lunch.','Vous êtes calme tant qu’on ne touche pas à vos proches, votre sommeil ou la dernière gourmandise. On peut compter sur vous, mais les négociations importantes attendront après le déjeuner.')},dolphin:{emoji:'🐬',image:'../../meme-life-dolphin.png',desc:tr('Вы входите в комнату — и у комнаты внезапно появляется настроение. Умеете знакомить незнакомых, превращать обычный день в историю и смеяться так, что подключается соседний столик. Главное — иногда всплывать подышать и отдыхать.','Сіз бөлмеге кіргенде, көңіл күй бірге кіреді. Бейтаныстарды таныстырып, жай күнді оқиғаға айналдырасыз. Кейде демалуды ұмытпаңыз.','You enter a room and the room suddenly has a mood. You connect strangers and turn an ordinary day into a story. Remember to surface and rest sometimes.','Vous entrez dans une pièce et l’ambiance arrive avec vous. Vous reliez les inconnus et transformez une journée ordinaire en histoire. Pensez aussi à vous reposer.')}}};


const ONLINE='https://zhanat-arch.github.io/Portable-Tests/';const RESULT_UI={ru:{take:'Пройти этот тест',other:'Другие тесты',shared:'С вами поделились результатом'},kk:{take:'Осы тесттен өту',other:'Басқа тесттер',shared:'Сізбен нәтижені бөлісті'},en:{take:'Take this test',other:'Other tests',shared:'Someone shared this result with you'},fr:{take:'Faire ce test',other:'Autres tests',shared:'Ce résultat a été partagé avec vous'}};const enc=v=>btoa(unescape(encodeURIComponent(JSON.stringify(v)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');const dec=v=>{try{return JSON.parse(decodeURIComponent(escape(atob(v.replaceAll('-','+').replaceAll('_','/')))))}catch{return null}};const id=globalThis.PORTABLE_TEST_ID||new URLSearchParams(location.search).get('test')||'team';const test=tests[id]||tests.team;const browserLang=(navigator.language||'ru').toLowerCase().split('-')[0];let lang=localStorage.getItem('pt.lang')||(['ru','kk','en','fr'].includes(browserLang)?browserLang:'ru'),step=-1,answers=JSON.parse(localStorage.getItem(`pt.${id}.answers`)||'{}'),sharedResult=dec(location.hash.startsWith('#r=')?location.hash.slice(3):'');if(sharedResult?.test===id&&sharedResult.scores){lang=sharedResult.lang||lang;step=test.questions.length}const app=document.querySelector('#app');

function shell(body){app.innerHTML=`<header class="top"><a class="brand" href="https://zhanat-arch.github.io/Portable-Tests/"><span class="mark">P</span><span>Portable Tests</span></a><div class="tools"><select id="lang"><option>RU</option><option>KK</option><option>EN</option><option>FR</option></select></div></header>${body}`;document.querySelector('#lang').value=lang.toUpperCase();document.querySelector('#lang').onchange=e=>{lang=e.target.value.toLowerCase();localStorage.setItem('pt.lang',lang);render()}}
function intro(){const art=test.image?`<img class="hero-image" src="${test.image}" alt="">`:`<div class="hero-image" style="background:radial-gradient(circle at 25% 20%,#ffda70,transparent 25%),linear-gradient(135deg,#4132a5,#cc4f8d);display:grid;place-items:center;font-size:96px">${test.icon}</div>`;shell(`<main class="card"><div class="intro-art">${art}<span class="hero-shade"></span><span class="hero-badge ${test.fun?'fun':''}">${test.fun?u().fun:x(test.hook)}</span></div><h1>${x(test.title)}</h1><p class="lead">${x(test.intro)}</p><div class="meta"><span class="pill">${test.questions.length} ${u().questions}</span><span class="pill">${u().minutes}</span><span class="pill">${Object.keys(test.scales).length} ✦</span></div><div class="privacy">🔒 ${u().private}</div><button class="primary" id="start">${u().start} →</button></main>`);document.querySelector('#start').onclick=()=>{step=0;render()}}
function quiz(){const q=test.questions[step],v=answers[step],pct=Math.round(step/test.questions.length*100);shell(`<main class="card"><div class="progress-line"><span>${step+1} / ${test.questions.length}</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div><div class="scene"><div class="scene-icon">${test.icon}</div></div><h2 class="question">${x(q.text)}</h2><div class="answers">${u().answers.map((a,i)=>`<button class="answer ${v===i?'selected':''}" data-v="${i}"><b>${i+1}</b><span>${a}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="prev">← ${u().back}</button><button class="primary" id="next" ${v===undefined?'disabled':''}>${u().next} →</button></div></main>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.v;localStorage.setItem(`pt.${id}.answers`,JSON.stringify(answers));quiz()});document.querySelector('#prev').onclick=()=>{step=Math.max(-1,step-1);render()};document.querySelector('#next').onclick=()=>{step++;render()}}
function scores(){if(sharedResult)return Object.entries(sharedResult.scores).filter(([key])=>test.scales[key]).map(([key,value])=>({key,value})).sort((a,b)=>b.value-a.value);const s=Object.fromEntries(Object.keys(test.scales).map(k=>[k,{sum:0,max:0}]));test.questions.forEach((q,i)=>{s[q.scale].sum+=(answers[i]??0);s[q.scale].max+=4});return Object.entries(s).map(([key,v])=>({key,value:Math.round(v.sum/v.max*100)})).sort((a,b)=>b.value-a.value)}
function scoreBars(s){return `<div class="scores">${s.map((v,i)=>`<div class="score"><strong>${i<2?'✦':'·'} ${x(test.scales[v.key])}</strong><b>${v.value}%</b><div class="bar"><i style="width:${v.value}%;background:${['#5a50df','#d85f94','#25a48f','#e09a3e','#4387d8','#7954c7'][i]}"></i></div></div>`).join('')}</div>`}
function result(){const s=scores(),top=s.slice(0,2),profile=funProfiles?.[id]?.[top[0].key],resultUrl=`${ONLINE}tests/quick/index.html?v=144&test=${id}#r=${enc({v:1,test:id,lang,scores:Object.fromEntries(s.map(x=>[x.key,x.value]))})}`,text=test.fun?`${x(test.title)}: ${profile?.emoji||test.icon} ${x(test.scales[top[0].key])}`: `${x(test.title)}: ${top.map(v=>`${x(test.scales[v.key])} ${v.value}%`).join(', ')}`;const body=test.fun?`<section class="meme-result">${profile?.image?`<img class="meme-photo" src="${profile.image}" alt="${x(test.scales[top[0].key])}">`:`<div class="meme-emoji">${profile?.emoji||test.icon}</div>`}<div class="eyebrow">${u().resultLabel}</div><h1>${u().youAre} ${x(test.scales[top[0].key])}</h1><p>${profile?x(profile.desc):u().funNote}</p><div class="meme-side">✦ ${u().also}: <b>${x(test.scales[top[1].key])}</b></div></section><details class="score-details"><summary>${u().details}</summary>${scoreBars(s)}</details>`: `<section class="result-head"><div class="eyebrow">${sharedResult?RESULT_UI[lang].shared:'Portable Tests'}</div><div class="result-symbols">${test.icon} ✦</div><h1>${u().result}</h1><p class="summary">${u().lead}</p></section>${scoreBars(s)}<div class="mini"><h3>${top.map(v=>x(test.scales[v.key])).join(' + ')}</h3><p>${u().note}</p></div>`;shell(`<main class="card">${sharedResult&&test.fun?`<div class="shared-note">${RESULT_UI[lang].shared}</div>`:''}${body}<div class="footer-actions"><button class="primary" id="share">${u().share}</button><button class="secondary" id="copy">${u().copy}</button><button class="secondary" id="again">${RESULT_UI[lang].take}</button><a class="btn ghost" href="https://zhanat-arch.github.io/Portable-Tests/">${RESULT_UI[lang].other}</a></div></main>`);document.querySelector('#share').onclick=()=>navigator.share?navigator.share({title:x(test.title),text,url:resultUrl}):copy(`${text}\n${resultUrl}`);document.querySelector('#copy').onclick=()=>copy(`${text}\n${resultUrl}`);document.querySelector('#again').onclick=()=>{history.replaceState(null,'',`${location.pathname}?test=${id}`);sharedResult=null;answers={};localStorage.removeItem(`pt.${id}.answers`);step=0;render()}}
async function copy(v){await navigator.clipboard.writeText(v);const e=document.querySelector('#toast');e.textContent=u().copied;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function render(){document.documentElement.lang=lang;if(step<0)intro();else if(step<test.questions.length)quiz();else result()}render();
</script></body></html>
