function ptSafeValue(value){return String(value||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,48)}
function ptModuleId(){
  const path=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
  const test=ptSafeValue(new URLSearchParams(location.search).get('test'));
  if(test)return `quick_${test}`;
  const rootIndex=path.indexOf('Portable-Tests');
  const parts=path.slice(rootIndex>=0?rootIndex+1:0).filter(part=>!part.endsWith('.html'));
  return ptSafeValue(parts.join('_'))||'home';
}
function ptSafePage(){
  const test=ptSafeValue(new URLSearchParams(location.search).get('test'));
  return `${location.origin}${location.pathname}${test?`?test=${test}`:''}`;
}
function ptTrack(eventName,parameters={}){
  if(typeof window.gtag!=='function')return;
  const safe={module_id:ptModuleId(),language:ptLanguage()};
  for(const [key,value] of Object.entries(parameters))safe[key]=typeof value==='number'?value:ptSafeValue(value);
  window.gtag('event',eventName,safe);
}

  window.gtag('event','page_view',{page_title:document.title,page_location:ptSafePage(),page_path:location.pathname,module_id:ptModuleId(),language:ptLanguage()});
  document.addEventListener('click',event=>{

function ptLanguage(){
  const html=(document.documentElement.lang||'').slice(0,2).toLowerCase();
  if(PT_LANGS.includes(html))return html;
  try{const saved=(localStorage.getItem('pt.lang')||'').slice(0,2).toLowerCase();if(PT_LANGS.includes(saved))return saved}catch{}
  return 'ru';
}

function ptTheme(){
  try{return localStorage.getItem('pt.theme')==='readable'?'readable':'normal'}catch{return 'normal'}
}

function ptApplyTheme(theme){
  const value=theme==='readable'?'readable':'normal';
  document.documentElement.dataset.ptTheme=value;
  try{localStorage.setItem('pt.theme',value)}catch{}
  document.querySelectorAll('[data-pt-theme-choice]').forEach(button=>{
    const active=button.dataset.ptThemeChoice===value;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
}

function ptRemoveLegacySupport(){
  document.querySelectorAll('.support-card').forEach(element=>element.hidden=true);
  document.querySelectorAll('#support').forEach(button=>button.closest('.support')?.setAttribute('hidden',''));
  document.querySelectorAll('p.support').forEach(element=>element.hidden=true);
}

function ptFooterMarkup(){
  const copy=PT_COPY[ptLanguage()],theme=ptTheme();
  return `<span class="pt-footer-kicker">PORTABLE TESTS · v${PT_VERSION}</span><h2>${copy.title}</h2><p>${copy.text}</p><div class="pt-footer-actions"><button class="pt-footer-button primary" type="button" data-pt-install>📲 ${copy.install}</button><button class="pt-footer-button" type="button" data-pt-share>↗ ${copy.share}</button><a class="pt-footer-button" href="${PT_SUPPORT.boosty}" target="_blank" rel="noopener">☕ ${copy.boosty}</a><a class="pt-footer-button" href="${PT_SUPPORT.kofi}" target="_blank" rel="noopener">☕ ${copy.kofi}</a><button class="pt-footer-button" type="button" data-pt-update>↻ ${copy.update} · v${PT_VERSION}</button></div><small class="pt-footer-privacy">🔒 ${copy.privacy}<br>📊 ${PT_METRICS_COPY[ptLanguage()]}</small><div class="pt-footer-bottom"><div class="pt-footer-theme"><span>Аа · ${copy.theme}</span><button class="pt-theme-choice ${theme==='normal'?'active':''}" type="button" data-pt-theme-choice="normal" aria-pressed="${theme==='normal'}">${copy.normal}</button><button class="pt-theme-choice ${theme==='readable'?'active':''}" type="button" data-pt-theme-choice="readable" aria-pressed="${theme==='readable'}">${copy.readable}</button></div><p class="pt-ambassador">📣 ${copy.ambassador}</p></div>`;
}

function ptToast(message){
  let toast=document.querySelector('.pt-global-toast');
  if(!toast){toast=document.createElement('div');toast.className='pt-global-toast';toast.setAttribute('role','status');document.body.appendChild(toast)}
  toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900);
}

async function ptShareApp(){
  const copy=PT_COPY[ptLanguage()];
  const data={title:'Portable Tests',text:copy.text,url:PT_HOME};
  try{
    if(navigator.share)await navigator.share(data);
    else{await navigator.clipboard.writeText(PT_HOME);ptToast(copy.copied)}
  }catch(error){if(error?.name!=='AbortError')ptToast(copy.copied)}
}

function ptIsInstalled(){
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function ptInstallHelp(){
  const copy=PT_COPY[ptLanguage()],isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let dialog=document.querySelector('.pt-install-dialog');
  if(!dialog){dialog=document.createElement('dialog');dialog.className='pt-install-dialog';document.body.appendChild(dialog)}
  dialog.innerHTML=`<div class="pt-install-card"><h2>📲 ${copy.installTitle}</h2><p>${isIos?copy.iosSteps:copy.browserSteps}</p><button type="button">${copy.close}</button></div>`;
  dialog.querySelector('button').addEventListener('click',()=>dialog.close());
  dialog.showModal();
}

async function ptInstallApp(){
  const copy=PT_COPY[ptLanguage()];
  if(ptIsInstalled())return ptToast(copy.installed);
  if(!ptInstallPrompt)return ptInstallHelp();
  ptInstallPrompt.prompt();
  await ptInstallPrompt.userChoice;
  ptInstallPrompt=null;
}

async function ptUpdateApp(){
  const copy=PT_COPY[ptLanguage()];
  try{
    const registration=await navigator.serviceWorker?.getRegistration(PT_ROOT) || await navigator.serviceWorker?.register(`${PT_ROOT}service-worker.js`,{scope:PT_ROOT});
    await registration?.update();
    if(registration?.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
  }catch{}
  ptToast(copy.updating);
  setTimeout(()=>location.reload(),900);
}

function ptEnsurePwa(){
  if(!document.querySelector('link[rel="manifest"]')){const link=document.createElement('link');link.rel='manifest';link.href=`${PT_ROOT}manifest.webmanifest`;document.head.appendChild(link)}
  if(!document.querySelector('link[rel="apple-touch-icon"]')){const link=document.createElement('link');link.rel='apple-touch-icon';link.href=`${PT_ROOT}icon-192.png`;document.head.appendChild(link)}
  if(!document.querySelector('meta[name="apple-mobile-web-app-capable"]')){const meta=document.createElement('meta');meta.name='apple-mobile-web-app-capable';meta.content='yes';document.head.appendChild(meta)}
  navigator.serviceWorker?.register(`${PT_ROOT}service-worker.js`,{scope:PT_ROOT}).then(registration=>registration.update()).catch(()=>{});
}

function ptRenderFooter(){
  ptInstallStyles();ptRemoveLegacySupport();
  let footer=document.querySelector('.pt-global-footer');
  if(!footer){footer=document.createElement('footer');footer.className='pt-global-footer';document.body.appendChild(footer)}
  footer.innerHTML=ptFooterMarkup();
  footer.querySelector('[data-pt-share]').addEventListener('click',ptShareApp);
  footer.querySelector('[data-pt-install]').addEventListener('click',ptInstallApp);
  footer.querySelector('[data-pt-update]').addEventListener('click',ptUpdateApp);
  footer.querySelectorAll('[data-pt-theme-choice]').forEach(button=>button.addEventListener('click',()=>ptApplyTheme(button.dataset.ptThemeChoice)));
  ptApplyTheme(ptTheme());
}

function ptStart(){
  ptEnsureSeo();
  ptAnalytics();
  ptEnsurePwa();
  ptRenderFooter();
  let scheduled=false;
  const refresh=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;ptRemoveLegacySupport()})};
  new MutationObserver(refresh).observe(document.body,{childList:true,subtree:true});
  new MutationObserver(ptRenderFooter).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
}

window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();ptInstallPrompt=event});
window.addEventListener('appinstalled',()=>{ptInstallPrompt=null;ptToast(PT_COPY[ptLanguage()].installed)});

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ptStart,{once:true});else ptStart();

const $ = selector => document.querySelector(selector);
const app = $('#app');
const t = () => UI[lang];
const copyFor = id => COPY[lang][id];
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
function read(key) { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } }

function shell(content) {
  app.innerHTML = `<header class="top"><a class="brand" href="https://zhanat-arch.github.io/Portable-Tests/"><span class="mark">P</span><span>${t().app}</span></a><div class="tools"><a class="ghost home-link" href="https://zhanat-arch.github.io/Portable-Tests/">⌂ ${t().home}</a><select id="lang" aria-label="Language">${supported.map(code => `<option>${code.toUpperCase()}</option>`).join('')}</select></div></header>${content}`;
  $('#lang').value = lang.toUpperCase();
  $('#lang').onchange = event => { lang = event.target.value.toLowerCase(); localStorage.setItem('pt.lang', lang); document.documentElement.lang = lang; render(); };
}

function intro() {
  shell(`<main class="card"><div class="intro-art"><img class="hero-image" src="../../hero-career.webp" alt=""><span class="hero-shade"></span><span class="hero-badge">${t().badge}</span></div><h1>${t().introTitle}</h1><p class="lead">${t().intro}</p><div class="meta"><span class="pill">42 ${t().q}</span><span class="pill">${t().min}</span><span class="pill">7 ${t().paths}</span></div><div class="privacy">🔒 ${t().privacy}</div><div class="cta"><button class="primary" id="start">${t().start} →</button><a class="btn secondary" href="../../downloads/career-interests.html" download>${t().download}</a></div></main>`);
  $('#start').onclick = () => { screen = 'quiz'; at = firstMissing(); render(); };
}

function firstMissing() { const index = questions.findIndex(question => answers[question.id] === undefined); return index < 0 ? 0 : index; }

function quiz() {
  const question = questions[at];
  const value = answers[question.id];
  const percent = Math.round(at / questions.length * 100);
  shell(`<main class="card"><div class="progress-line"><span>${at + 1} ${t().of} ${questions.length}</span><span>${percent}%</span></div><div class="track"><i style="width:${percent}%"></i></div><p class="question-hint">${t().instruction}</p><h2 class="question">${question.text[lang]}</h2><div class="answers">${t().choices.map((label, index) => `<button class="answer ${value === index ? 'selected' : ''}" data-value="${index}"><b>${index + 1}</b><span>${label}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="prev" ${at === 0 ? 'disabled' : ''}>← ${t().back}</button><button class="primary" id="next" ${value === undefined ? 'disabled' : ''}>${t().next} →</button></div></main>`);
  document.querySelectorAll('.answer').forEach(button => button.onclick = () => { answers[question.id] = Number(button.dataset.value); localStorage.setItem('pt.career.v2.answers', JSON.stringify(answers)); quiz(); });
  $('#prev').onclick = () => { if (at > 0) { at -= 1; render(); } };
  $('#next').onclick = advance;
}

function advance() {
  if (at === questions.length - 1) { screen = 'result'; render(); return; }
  at += 1;
  if ([14, 28, 38].includes(at)) screen = 'milestone';
  render();
}

function milestone() {
  const index = at < 20 ? 0 : at < 35 ? 1 : 2;
  shell(`<main class="card milestone"><div class="big">${['🌱', '🧭', '🌟'][index]}</div><h2>${t().milestones[index]}</h2><p class="lead">${at} ${t().of} ${questions.length}</p><button class="primary" id="go">${t().continue} →</button></main>`);
  $('#go').onclick = () => { screen = 'quiz'; render(); };
}

function calculateScores(sourceAnswers = answers) {
  const sums = Object.fromEntries(scales.map(scale => [scale, 0]));
  const maximums = Object.fromEntries(scales.map(scale => [scale, 0]));
  questions.forEach(question => Object.entries(question.weights).forEach(([scale, weight]) => {
    sums[scale] += (sourceAnswers[question.id] ?? 2) * weight;
    maximums[scale] += 4 * weight;
  }));
  return scales.map(id => ({ id, value: Math.round(sums[id] / maximums[id] * 100) })).sort((a, b) => b.value - a.value);
}

function scoreList() {
  if (!sharedResult) return calculateScores();
  return Object.entries(sharedResult.scores).filter(([id]) => scales.includes(id)).map(([id, value]) => ({ id, value: Number(value) })).sort((a, b) => b.value - a.value);
}

function careerMatches(scores) {
  const map = Object.fromEntries(scores.map(item => [item.id, item.value]));
  return careers.map(career => {
    const entries = Object.entries(career.w);
    const value = Math.round(entries.reduce((sum, [id, weight]) => sum + (map[id] || 0) * weight, 0) / entries.reduce((sum, [, weight]) => sum + weight, 0));
    const reasons = entries.sort((a, b) => (map[b[0]] * b[1]) - (map[a[0]] * a[1])).slice(0, 2).map(([id]) => t().labels[id]);
    return { ...career, value, reasons };
  }).sort((a, b) => b.value - a.value);
}

function band(value) { return value < 25 ? 0 : value < 45 ? 1 : value < 60 ? 2 : value < 75 ? 3 : 4; }

function result() {
  const scores = scoreList();
  const [top, second] = scores;
  const low = [...scores].sort((a, b) => a.value - b.value).slice(0, 2);
  const topCopy = copyFor(top.id);
  const secondCopy = copyFor(second.id);
  const jobs = careerMatches(scores).slice(0, 10);
  const payload = { v: 2, test: 'career', lang, scores: Object.fromEntries(scores.map(item => [item.id, item.value])) };
  const resultUrl = `${ONLINE}tests/career/index.html#r=${enc(payload)}`;
  const shareText = `${t().result}: ${t().labels[top.id]} + ${t().labels[second.id]}`;
  const gap = Math.abs(top.value - second.value);
  const blendText = gap <= 10
    ? `${topCopy[1]} ${secondCopy[1]}`
    : `${topCopy[1]} ${lang === 'ru' ? 'Второе направление добавляет к профилю:' : lang === 'kk' ? 'Екінші бағыт профильге қосады:' : lang === 'fr' ? 'La seconde direction ajoute :' : 'The second direction adds:'} ${secondCopy[0].toLowerCase()}.`;

  shell(`<main class="card result-card"><section class="result-head"><div class="eyebrow">${sharedResult ? t().shared : t().version}</div><div class="result-symbols">${profiles[top.id].emoji} ${profiles[second.id].emoji}</div><h1>${topCopy[0]} + ${secondCopy[0]}</h1><p class="summary">${t().introResult}</p></section>
    <section class="feature"><span class="eyebrow">${t().blend}</span><h2>${t().labels[top.id]} × ${t().labels[second.id]}</h2><p>${blendText}</p><blockquote>${topCopy[7]}</blockquote></section>
    <div class="grid rich-grid"><section class="mini"><h3>✦ ${t().strength}</h3><p>${topCopy[2]} ${secondCopy[2]}</p></section><section class="mini"><h3>⚠ ${t().shadow}</h3><p>${topCopy[3]} ${secondCopy[3]}</p></section><section class="mini"><h3>☀ ${t().environment}</h3><p>${topCopy[4]} ${secondCopy[4]}</p></section><section class="mini"><h3>→ ${t().experiment}</h3><p>${topCopy[5]} ${secondCopy[5]}</p></section></div>
    <section class="section-block"><h2>${t().professions}</h2><p class="muted">${t().professionsNote}</p><div class="jobs">${jobs.map((job, index) => `<article class="job"><span class="job-rank">${index + 1}</span><div><h3>${esc(job.title[lang])}</h3><p><b>${t().why}:</b> ${job.reasons.join(' · ')}</p></div><strong>${job.value}%<small>${t().fit}</small></strong></article>`).join('')}</div></section>
    <section class="energy"><h2>${t().energy}</h2><p>${t().lowIntro}</p><div class="energy-tags">${low.map(item => `<span>${profiles[item.id].emoji} ${t().labels[item.id]}</span>`).join('')}</div></section>
    <section class="numbers"><h2>${t().numbers}</h2><p>${t().numbersText}</p><button class="secondary" id="toggle-scores">${t().full}</button><div class="scores collapsed" id="scores">${scores.map(item => `<div class="score"><strong>${profiles[item.id].emoji} ${t().labels[item.id]}<small>${t().bands[band(item.value)]}</small></strong><b>${item.value}%</b><div class="bar"><i style="width:${item.value}%;background:${profiles[item.id].color}"></i></div></div>`).join('')}</div></section>
    <p class="disclaimer">${t().disclaimer}</p><div class="footer-actions"><button class="primary" id="share">${t().share}</button><button class="secondary" id="copy">${t().copy}</button><button class="secondary" id="again">${t().restart}</button><a class="btn ghost" href="https://zhanat-arch.github.io/Portable-Tests/">${t().other}</a>${sharedResult ? '' : `<button class="ghost" id="delete">${t().delete}</button>`}</div><div class="support"><button class="ghost" id="support">${t().support}</button></div></main>
    <dialog id="support-dialog"><h2>${t().support}</h2><p class="lead">${t().supportText}</p><div class="links"><a class="btn primary" href="${SUPPORT.boosty}" target="_blank" rel="noopener">Boosty</a><a class="btn secondary" href="${SUPPORT.kofi}" target="_blank" rel="noopener">Ko-fi</a><button class="ghost" id="close">${t().close}</button></div></dialog>`);

  $('#toggle-scores').onclick = event => { const list = $('#scores'); const open = list.classList.toggle('open'); event.currentTarget.textContent = open ? t().hide : t().full; };
  $('#share').onclick = async () => navigator.share ? navigator.share({ title: t().result, text: shareText, url: resultUrl }) : copy(`${shareText}\n${resultUrl}`);
  $('#copy').onclick = () => copy(`${shareText}\n${resultUrl}`);
  $('#again').onclick = () => { history.replaceState(null, '', location.pathname); sharedResult = null; answers = {}; localStorage.removeItem('pt.career.v2.answers'); at = 0; screen = 'quiz'; render(); };
  if ($('#delete')) $('#delete').onclick = () => { answers = {}; localStorage.removeItem('pt.career.v2.answers'); toast(t().copied); };
  $('#support').onclick = () => $('#support-dialog').showModal();
  $('#close').onclick = () => $('#support-dialog').close();
}

async function copy(value) { await navigator.clipboard.writeText(value); toast(t().copied); }
function toast(value) { const element = $('#toast'); element.textContent = value; element.classList.add('show'); setTimeout(() => element.classList.remove('show'), 1800); }
function render() { document.documentElement.lang = lang; ({ intro, quiz, milestone, result }[screen])(); }
render();
</script></body></html>
