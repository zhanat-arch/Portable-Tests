<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="description" content="PortHub — tests, games and personal insights in four languages."><link rel="canonical" href="https://porthub.fyi/"><link rel="alternate" hreflang="ru" href="https://porthub.fyi/ru/"><link rel="alternate" hreflang="kk" href="https://porthub.fyi/kk/"><link rel="alternate" hreflang="en" href="https://porthub.fyi/en/"><link rel="alternate" hreflang="fr" href="https://porthub.fyi/fr/"><link rel="alternate" hreflang="x-default" href="https://porthub.fyi/"><link rel="icon" href="icon-porthub-192.png"><title>PortHub — choose your language</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0d18;color:#fff;font:700 18px system-ui}.card{padding:30px;text-align:center}.langs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.langs a{padding:13px 18px;border-radius:14px;background:#2c2643;color:#fff;text-decoration:none}.langs a:hover{background:#8052e8}</style><script>(()=>{const supported=['ru','kk','en','fr'],query=(new URLSearchParams(location.search).get('lang')||'').slice(0,2).toLowerCase();let saved='';try{saved=(localStorage.getItem('pt.lang')||'').slice(0,2).toLowerCase()}catch{}const browser=(navigator.languages||[navigator.language||'']).map(value=>String(value).slice(0,2).toLowerCase()).find(value=>supported.includes(value));const lang=supported.includes(query)?query:supported.includes(saved)?saved:browser||'ru';try{localStorage.setItem('pt.lang',lang)}catch{}location.replace(new URL(`${lang}/${location.hash}`,location.href).href)})();</script></head><body><main class="card"><h1>PortHub</h1><p>Choose your language</p><nav class="langs"><a href="ru/">Русский</a><a href="kk/">Қазақша</a><a href="en/">English</a><a href="fr/">Français</a></nav></main></body></html>
