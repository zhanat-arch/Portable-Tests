ru:{back:'На главную',badge:'ИНТЕРАКТИВНЫЙ ОТВЕТ',title:'Кубик судьбы',accent:'в 3D',lead:'Задайте вопрос в уме, выберите тему и бросьте кубик. Ответ случайный, но иногда именно случайная формулировка помогает услышать собственное решение.',choose:'О чём вопрос?',topics:{money:'💰 Деньги',love:'❤️ Любовь',path:'🧭 Выбор пути',day:'☀ Совет дня'},throw:'Бросить кубик',again:'Бросить ещё раз',shake:'Включить встряхивание',shakeOn:'Встряхивание включено',hint:'Нажмите на кубик или кнопку. На поддерживаемом телефоне можно включить встряхивание.',symbolic:'Символический шанс',download:'Скачать карточку PNG',share:'Поделиться результатом',copied:'Ссылка скопирована',privacy:'Кубик использует случайное число на вашем устройстве. Процент символический: это не настоящая вероятность события и не основание для финансовых, медицинских или личных решений.',shareText:'Мой ответ Кубика судьбы: {title} · {chance}%',downloaded:'Карточка сохранена',titles:['Пауза тоже ответ','Два пути','Не хватает одного факта','Опора уже есть','Поворот близко','Можно двигаться'],faces:['Не торопите ответ. Сейчас полезнее убрать лишний шум, проверить первое условие и вернуться к вопросу с ясной головой.','В вопросе действуют две равноценные силы. Выберите маленький обратимый шаг: он быстрее покажет, какая сторона действительно ваша.','Решение почти видно, но не хватает третьего факта, разговора или цифры. Найдите его — и неопределённость резко уменьшится.','Ситуация устойчивее, чем кажется. Опирайтесь на уже работающий порядок и не меняйте всё сразу ради минутного импульса.','Перемена полезна, если вы сами зададите ей направление. Оставьте место неожиданности, но заранее обозначьте границу риска.','Энергии достаточно для старта. Сделайте первый конкретный шаг в ближайшие сутки, пока внутреннее согласие не превратилось в бесконечные размышления.'],contexts:{money:'В денежной теме сначала отделите желание от расчёта.',love:'В отношениях важны прямой разговор и уважение к границам.',path:'В выборе пути проверяйте направление небольшим реальным действием.',day:'На сегодня важнее один понятный приоритет, чем длинный список.'}},
kk:{back:'Басты бетке',badge:'ИНТЕРАКТИВТІ ЖАУАП',title:'Тағдыр кубигі',accent:'3D форматында',lead:'Сұрақты ойыңызда қойып, тақырыпты таңдаңыз да, кубикті лақтырыңыз. Жауап кездейсоқ, бірақ кейде кездейсоқ сөз өз шешіміңізді естуге көмектеседі.',choose:'Сұрақ не туралы?',topics:{money:'💰 Ақша',love:'❤️ Махаббат',path:'🧭 Жол таңдау',day:'☀ Күн кеңесі'},throw:'Кубикті лақтыру',again:'Тағы лақтыру',shake:'Сілкуді қосу',shakeOn:'Сілку қосылды',hint:'Кубикті немесе батырманы басыңыз. Қолдайтын телефонда сілкуге болады.',symbolic:'Символдық мүмкіндік',download:'PNG карточкасын жүктеу',share:'Нәтижемен бөлісу',copied:'Сілтеме көшірілді',privacy:'Кубик құрылғыдағы кездейсоқ санды қолданады. Пайыз символдық: бұл оқиғаның нақты ықтималдығы емес және қаржы, денсаулық не жеке шешімге негіз болмайды.',shareText:'Тағдыр кубигінің жауабы: {title} · {chance}%',downloaded:'Карточка сақталды',titles:['Үзіліс те жауап','Екі жол','Бір дерек жетіспейді','Тірек бар','Бұрылыс жақын','Қозғалуға болады'],faces:['Жауапты асықтырмаңыз. Артық шуды азайтып, бірінші шартты тексеріп, сұраққа айқын оймен оралыңыз.','Сұрақта екі тең күш бар. Кішкентай әрі қайтаруға болатын қадам таңдаңыз: ол қай жақ шынымен сіздікі екенін көрсетеді.','Шешім көрініп тұр, бірақ үшінші дерек, әңгіме немесе сан жетіспейді. Оны тапсаңыз, белгісіздік азаяды.','Жағдай ойлағаннан тұрақты. Жұмыс істеп тұрған тәртіпке сүйеніп, бір сәттік импульспен бәрін өзгертпеңіз.','Өз бағытыңызды берсеңіз, өзгеріс пайдалы болады. Күтпегенге орын қалдырып, тәуекел шекарасын алдын ала белгілеңіз.','Бастауға қуат жеткілікті. Ішкі келісім ұзақ ойға айналмай тұрғанда, бір нақты қадам жасаңыз.'],contexts:{money:'Ақшада қалауды есептен ажыратыңыз.',love:'Қарым-қатынаста ашық әңгіме мен шекара маңызды.',path:'Жолды шағын нақты әрекетпен тексеріңіз.',day:'Бүгін ұзын тізімнен гөрі бір басымдық маңызды.'}},
en:{back:'Home',badge:'INTERACTIVE ANSWER',title:'Dice of Fate',accent:'in 3D',lead:'Hold a question in mind, choose a theme, and roll. The answer is random, yet a random phrase can sometimes help you hear your own decision.',choose:'What is the question about?',topics:{money:'💰 Money',love:'❤️ Love',path:'🧭 Path choice',day:'☀ Advice for today'},throw:'Roll the dice',again:'Roll again',shake:'Enable phone shake',shakeOn:'Shake enabled',hint:'Tap the cube or button. On a supported phone, you can enable shake-to-roll.',symbolic:'Symbolic chance',download:'Download PNG card',share:'Share result',copied:'Link copied',privacy:'The dice uses a random number generated on your device. The percentage is symbolic, not a real probability and not a basis for financial, medical, or personal decisions.',shareText:'My Dice of Fate answer: {title} · {chance}%',downloaded:'Card saved',titles:['A pause is also an answer','Two paths','One fact is missing','The foundation is there','A turn is near','You can move'],faces:['Do not force the answer. Clear some noise, check the first condition, and return to the question with a calmer mind.','Two equally strong forces are at work. Choose one small reversible step; it will reveal which side is truly yours.','The answer is close, but one more fact, conversation, or number is missing. Find it and uncertainty will shrink quickly.','The situation is steadier than it looks. Build on what already works instead of changing everything on a brief impulse.','Change can help if you give it direction. Leave room for surprise, but set the boundary of risk in advance.','There is enough energy to begin. Take one concrete step within a day before inner agreement turns into endless thinking.'],contexts:{money:'With money, separate desire from calculation first.',love:'In relationships, direct conversation and boundaries matter.',path:'Test the direction with one small real-world action.',day:'One clear priority matters more today than a long list.'}},
fr:{back:'Accueil',badge:'RÉPONSE INTERACTIVE',title:'Dé du destin',accent:'en 3D',lead:'Gardez une question en tête, choisissez un thème et lancez le dé. La réponse est aléatoire, mais une phrase inattendue aide parfois à entendre sa propre décision.',choose:'Quel est le thème ?',topics:{money:'💰 Argent',love:'❤️ Amour',path:'🧭 Choix du chemin',day:'☀ Conseil du jour'},throw:'Lancer le dé',again:'Relancer',shake:'Activer le mouvement',shakeOn:'Mouvement activé',hint:'Touchez le dé ou le bouton. Sur un téléphone compatible, activez le mouvement.',symbolic:'Chance symbolique',download:'Télécharger la carte PNG',share:'Partager le résultat',copied:'Lien copié',privacy:'Le dé utilise un nombre aléatoire généré sur votre appareil. Le pourcentage est symbolique : ce n’est pas une vraie probabilité ni une base de décision financière, médicale ou personnelle.',shareText:'Ma réponse du Dé du destin : {title} · {chance} %',downloaded:'Carte enregistrée',titles:['La pause est aussi une réponse','Deux chemins','Un fait manque','La base existe déjà','Un tournant approche','Vous pouvez avancer'],faces:['Ne forcez pas la réponse. Écartez un peu de bruit, vérifiez la première condition et revenez à la question avec plus de clarté.','Deux forces équivalentes agissent. Choisissez une petite étape réversible : elle révélera rapidement le côté qui vous correspond.','La réponse est proche, mais il manque un fait, une conversation ou un chiffre. Trouvez-le et l’incertitude diminuera.','La situation est plus stable qu’elle ne paraît. Appuyez-vous sur ce qui fonctionne déjà au lieu de tout changer sur une impulsion.','Le changement peut aider si vous lui donnez une direction. Laissez une place à la surprise, mais fixez la limite du risque.','Il y a assez d’énergie pour commencer. Faites un premier pas concret dans la journée avant que l’accord intérieur ne devienne réflexion sans fin.'],contexts:{money:'Pour l’argent, séparez d’abord le désir du calcul.',love:'Dans les relations, le dialogue direct et les limites comptent.',path:'Testez la direction par une petite action réelle.',day:'Une priorité claire compte plus aujourd’hui qu’une longue liste.'}}
};
const T=()=>D[lang];
const orientation={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
const pips={1:['p4'],2:['p1','p7'],3:['p1','p4','p7'],4:['p1','p2','p6','p7'],5:['p1','p2','p4','p6','p7'],6:['p1','p2','p3','p5','p6','p7']};
function face(number,name){return `<div class="face ${name}">${pips[number].map(pos=>`<i class="pip ${pos}"></i>`).join('')}</div>`}
function shell(){const t=T();document.documentElement.lang=lang;document.title=`${t.title} · Portable Tests`;document.querySelector('#app').innerHTML=`<header class="top"><a class="brand" href="../index.html"><span class="mark">🎲</span><span>Portable Tests</span></a><div class="tools"><a href="../index.html">← ${t.back}</a><select id="lang" aria-label="Language">${LANGS.map(code=>`<option value="${code}" ${code===lang?'selected':''}>${code.toUpperCase()}</option>`).join('')}</select></div></header><main><section class="hero"><div class="eyebrow">${t.badge}</div><h1>${t.title}<em>${t.accent}</em></h1><p>${t.lead}</p></section><section class="game panel"><h2 class="topic-title">${t.choose}</h2><div class="topics">${Object.entries(t.topics).map(([id,label])=>`<button class="topic ${id===topic?'selected':''}" data-topic="${id}">${label}</button>`).join('')}</div><div class="stage" id="stage"><div class="cube" id="cube" role="button" tabindex="0" aria-label="${t.throw}">${face(1,'one')}${face(6,'six')}${face(3,'three')}${face(4,'four')}${face(2,'two')}${face(5,'five')}</div></div><div class="controls"><button class="primary" id="throw">${currentResult?t.again:t.throw}</button><button class="secondary ${shakeEnabled?'shake-on':''}" id="shake">${shakeEnabled?t.shakeOn:t.shake}</button></div><p class="hint">${t.hint}</p></section><section class="result panel" id="result" aria-live="polite" ${currentResult?'':'hidden'}></section></main>`;bind();if(currentResult){settle(currentResult.face,false);showResult(currentResult)}}
function bind(){document.querySelector('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('pt.lang',lang);shell()};document.querySelectorAll('[data-topic]').forEach(button=>button.onclick=()=>{topic=button.dataset.topic;currentResult=null;history.replaceState(null,'',location.pathname);shell()});document.querySelector('#throw').onclick=roll;const cube=document.querySelector('#cube');cube.onclick=roll;cube.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll()}};document.querySelector('#shake').onclick=enableShake}
function randomInt(max){const range=2**32,limit=Math.floor(range/max)*max,a=new Uint32Array(1);do crypto.getRandomValues(a);while(a[0]>=limit);return a[0]%max}
function resultCopy(data){const t=T(),variants=EXTRA[lang]?.[data.topic]||EXTRA.ru[data.topic],variant=variants[(data.variant||0)%variants.length];return `${t.contexts[data.topic]} ${t.faces[data.face-1]} ${variant}`}
function settle(face,animated=true){const cube=document.querySelector('#cube'),[x,y]=orientation[face];cube.style.transition=animated?'':'none';cube.style.transform=animated?`rotateX(${x+720+randomInt(3)*360}deg) rotateY(${y+720+randomInt(3)*360}deg) rotateZ(${720+randomInt(2)*360}deg)`:`rotateX(${x}deg) rotateY(${y}deg)`;if(!animated)requestAnimationFrame(()=>cube.style.transition='')}
function burst(){const stage=document.querySelector('#stage');for(let i=0;i<22;i++){const dot=document.createElement('i');dot.className='burst';const a=Math.PI*2*i/22,r=90+randomInt(110);dot.style.setProperty('--x',`${Math.cos(a)*r}px`);dot.style.setProperty('--y',`${Math.sin(a)*r}px`);dot.style.left='50%';dot.style.top='50%';stage.appendChild(dot);setTimeout(()=>dot.remove(),800)}}
function roll(){if(rolling)return;rolling=true;const button=document.querySelector('#throw'),cube=document.querySelector('#cube');button.disabled=true;cube.classList.add('rolling');navigator.vibrate?.([30,50,30]);const face=1+randomInt(6),offset={money:0,love:-2,path:3,day:1}[topic],chance=Math.max(35,Math.min(94,[44,56,63,72,81,89][face-1]+offset+randomInt(7)-3)),variant=randomInt(EXTRA[lang][topic].length);settle(face,true);setTimeout(()=>{currentResult={face,topic,chance,variant,lang};rolling=false;button.disabled=false;cube.classList.remove('rolling');burst();navigator.vibrate?.(40);showResult(currentResult);history.replaceState(null,'',`#r=${encode(currentResult)}`)},1680)}
function showResult(data){const t=T(),holder=document.querySelector('#result'),title=t.titles[data.face-1],copy=resultCopy(data);holder.hidden=false;holder.innerHTML=`<div class="result-top"><div><div class="eyebrow">${t.topics[data.topic]}</div><h2>${title}</h2></div><div class="result-number">${data.face}</div></div><p>${copy}</p><div class="chance"><strong>${data.chance}%</strong><span>${t.symbolic}</span></div><div class="result-actions"><button class="primary" id="share">${t.share}</button><button class="secondary" id="download">${t.download}</button></div><div class="privacy">🔒 ${t.privacy}</div>`;document.querySelector('#share').onclick=share;document.querySelector('#download').onclick=downloadCard;document.querySelector('#throw').textContent=t.again;holder.scrollIntoView({behavior:'smooth',block:'start'})}
function encode(value){return btoa(JSON.stringify(value)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
