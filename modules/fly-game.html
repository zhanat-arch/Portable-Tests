  <style>
    :root{color-scheme:dark;--bg:#0d0915;--panel:#1c142c;--ink:#fffaf2;--muted:#bdb4c8;--line:#3b304d;--gold:#f4ce73;--pink:#e1649d;--violet:#8265ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#4c2976 0,transparent 32%),radial-gradient(circle at 96% 24%,#733047 0,transparent 28%),var(--bg);color:var(--ink)}button,select{font:inherit}.app{width:min(1040px,100%);margin:auto;padding:14px 14px 65px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:950;text-decoration:none}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--violet),var(--pink));box-shadow:0 12px 30px #7c5dff48}.tools{display:flex;gap:7px}.tools a,.tools select{min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:#191326;color:var(--ink);text-decoration:none}.hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:clamp(20px,5vw,62px);padding:55px 0 28px}.hero-copy{position:relative;z-index:2}.eyebrow{color:var(--gold);font-size:.77rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(3.4rem,10vw,7rem);line-height:.86;letter-spacing:-.075em;margin:15px 0 22px}.hero h1 em{display:block;color:var(--gold);font-style:normal}.hero p{max-width:610px;color:#d5cede;font-size:1.08rem;line-height:1.65}.hero-art{position:relative;overflow:hidden;aspect-ratio:1;border:1px solid #ffffff20;border-radius:34px;background:#171125;box-shadow:0 35px 100px #0008}.hero-art img{width:100%;height:100%;object-fit:cover}.hero-art::after{content:"30 SEC";position:absolute;right:16px;bottom:16px;padding:9px 12px;border-radius:12px;background:#0d0915cc;color:var(--gold);font-weight:950;letter-spacing:.08em;backdrop-filter:blur(9px)}.panel{border:1px solid var(-   <style>

prank-fly.tired{animation:pant .18s infinite alternate;filter:drop-shadow(0 0 12px #e1a429)}.fly-hint{position:fixed;z-index:8999;width:180px;padding:9px 11px;border-radius:13px;background:#1a1725;color:#fff;font-size:.8rem;font-weight:900;text-align:center;pointer-events:none}.revenge-page{width:min(760px,calc(100% - 28px));margin:45px auto 80px}.revenge-card{padding:clamp(24px,6vw,50px);border:1px solid var(--line);border-radius:30px;background:#181224;text-align:center}.revenge-card h1{margin:10px 0 24px;font-size:clamp(2.2rem,8vw,4.5rem);line-height:.95;letter-spacing:-.055em}.real-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.real-stats div{padding:20px;border:1px solid var(--line);border-radius:18px;background:#21182f}.real-stats strong{display:block;color:var(--gold);font-size:2.5rem}.real-stats span{color:var(--muted)}.revenge-card h2{margin:30px 0 14px}.bait-list{display:grid;gap:9px;margin-bottom:18px}.bait{padding:15px;border:1px solid var(--line);border-radius:16px;background:#21182f;color:#fff;text-align:left;cursor:pointer}.bait.active{border-color:var(--gold);box-shadow:0 0 0 2px #f4ce7330}.bait b,.bait span{display:block}.bait span{margin-top:5px;color:var(--muted)}.revenge{width:100%;margin-top:4px}.revenge+.secondary{width:100%;margin-top:8px}.share-safe{color:var(--muted);font-size:.82rem;line-height:1.5}.pt-global-footer{clear:both}@keyframes dots{to{opacity:.35}}@keyframes pant{to{scale:.88;rotate:6deg}}@media(max-width:720px){.step-grid{grid-template-columns:1fr 1fr}.prank-page{margin-top:5vh}.fake-result{border-radius:24px}.fake-score{font-size:5rem}.prank-fly{width:60px;height:60px;font-size:43px}}@media(max-width:430px){.step-grid{grid-template-columns:1fr}.how{padding:20px}.step-grid article{min-height:auto}.real-stats{grid-template-columns:1fr 1fr}}
