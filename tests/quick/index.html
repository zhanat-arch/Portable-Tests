<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171632"><meta name="description" content="Portable Tests"><link rel="stylesheet" href="../career/styles.css"><style>.brand{text-decoration:none;color:inherit}.intro-art{height:290px!important;margin:-22px -22px 24px!important;border-radius:22px;overflow:hidden;background:#171632;display:block!important}.hero-image{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#171632e8)}.hero-badge{position:absolute;left:18px;bottom:16px;color:#fff;background:#171632b8;border:1px solid #ffffff35;padding:9px 12px;border-radius:12px;font-weight:800}.fun{background:#fff0a8;color:#553d00}.choice{display:flex;align-items:center;text-align:left;background:var(--soft);color:var(--ink);border:2px solid transparent}.choice:hover,.choice.selected{border-color:var(--p)}@media(max-width:560px){.intro-art{height:245px!important;margin:-13px -13px 22px!important}}.meme-result{text-align:center;padding:8px 4px 22px}.meme-emoji{font-size:104px;line-height:1.1;filter:drop-shadow(0 16px 22px #32236a35)}.meme-photo{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:22px;margin:0 auto 22px;box-shadow:0 22px 48px #21174c35}.meme-result h1{margin:8px 0 12px;font-size:clamp(2.2rem,8vw,4rem)}.meme-result p{font-size:1.15rem;line-height:1.6;max-width:620px;margin:0 auto}.meme-side{margin:22px auto 0;padding:13px;border-radius:15px;background:var(--soft);max-width:520px}.score-details{margin:12px 0 24px;border:1px solid var(--line);border-radius:16px;padding:0 15px}.score-details summary{cursor:pointer;font-weight:800;padding:15px 2px}.score-details .scores{padding-bottom:12px}.shared-note{text-align:center;color:var(--muted);font-weight:800;margin-bottom:15px}</style><title>Portable Tests</title></head><body><div class="ambient a1"></div><div class="ambient a2"></div><div id="app"></div><div id="toast"></div><script type="module" src="app-1.4.3.js"></script></body></html>
